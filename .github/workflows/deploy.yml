name: Deploy Local (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync runtime-data
        shell: powershell
        run: |
          $composeRoot = 'C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main'
          $target = Join-Path $composeRoot 'runtime-data'
          if (!(Test-Path $target)) { New-Item -ItemType Directory -Path $target | Out-Null }
          robocopy "$PWD\data"   (Join-Path $target 'data')   /MIR | Out-Null
          robocopy "$PWD\config" (Join-Path $target 'config') /MIR | Out-Null
          robocopy "$PWD\ldp"    (Join-Path $target 'ldp')    /MIR | Out-Null
          if (Test-Path "$PWD\file")   { robocopy "$PWD\file"   (Join-Path $target 'file')   /MIR | Out-Null }
          if (Test-Path "$PWD\images") { robocopy "$PWD\images" (Join-Path $target 'images') /MIR | Out-Null }

      - name: Restart service
        shell: powershell
        working-directory: C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main
        run: |
          docker compose up -d researchspace
          docker compose ps researchspace

      - name: Summary
        shell: powershell
        run: |
          docker compose ps researchspace | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY