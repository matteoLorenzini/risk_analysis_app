name: Deploy (Hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build & push Docker image to GHCR'
        required: true
        default: 'true'
      image_tag:
        description: 'Optional image tag (defaults to sha)'
        required: false
      registry:
        description: 'Container registry (default ghcr.io)'
        required: false
        default: 'ghcr.io'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: risk-analysis-app
      REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ inputs.build_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: ${{ inputs.build_image == 'true' }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo 'No Dockerfile present. Skipping build.'
            exit 0
          fi
          docker build -t ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$TAG .

      - name: Push image
        if: ${{ inputs.build_image == 'true' }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo 'No Dockerfile to push.'
            exit 0
          fi
          docker push ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$TAG

      - name: Summary
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "Build image: ${{ inputs.build_image }}" >> $GITHUB_STEP_SUMMARY
          echo "Dockerfile present: $( [ -f Dockerfile ] && echo yes || echo no )" >> $GITHUB_STEP_SUMMARY
