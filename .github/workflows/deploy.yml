name: Deploy Local (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-selfhosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Env summary
        shell: pwsh
        run: |
          Write-Host "PSVersion:"
          $PSVersionTable
          Write-Host "`nDocker executable locations:"
          where.exe docker 2>$null
          where.exe docker-compose 2>$null
          Write-Host "`nDocker version:"
          docker version || Write-Warning "Docker unavailable"
          Write-Host "`nCompose plugin version:"
          docker compose version || Write-Warning "Compose plugin unavailable"
          Write-Host "`nLegacy docker-compose version:"
          docker-compose version || Write-Warning "Legacy docker-compose unavailable"

      - uses: actions/checkout@v4

      - name: Set vars
        shell: pwsh
        run: |
          echo "COMPOSE_ROOT=C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main" >> $Env:GITHUB_ENV
          echo "SERVICE_NAME=researchspace" >> $Env:GITHUB_ENV

      - name: Sync runtime-data
        shell: pwsh
        run: |
          $composeRoot = $Env:COMPOSE_ROOT
          $target = Join-Path $composeRoot 'runtime-data'
          if (!(Test-Path $target)) { New-Item -ItemType Directory -Path $target | Out-Null }
          function SyncDir($src,$dst){
            if (Test-Path $src){
              robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
              $code = $LASTEXITCODE
              if ($code -ge 8){ Write-Error "Robocopy failed ($code) for $src" }
            }
          }
          SyncDir "$PWD\data"   (Join-Path $target 'data')
          SyncDir "$PWD\config" (Join-Path $target 'config')
          SyncDir "$PWD\ldp"    (Join-Path $target 'ldp')
          SyncDir "$PWD\file"   (Join-Path $target 'file')
          SyncDir "$PWD\images" (Join-Path $target 'images')
          Write-Host "Runtime data sync complete."

      - name: Pull image (best effort)
        shell: pwsh
        working-directory: ${{ env.COMPOSE_ROOT }}
        continue-on-error: true
        run: |
          if (docker compose version 2>$null) {
            docker compose pull $Env:SERVICE_NAME
          } elseif (docker-compose version 2>$null) {
            docker-compose pull $Env:SERVICE_NAME
          } else {
            Write-Warning "No compose command available."
          }

      - name: Restart service
        shell: pwsh
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: |
          $svc = $Env:SERVICE_NAME
          if (docker compose version 2>$null) {
            docker compose up -d --no-deps --force-recreate $svc
            docker compose ps $svc
          } elseif (docker-compose version 2>$null) {
            docker-compose up -d --no-deps --force-recreate $svc
            docker-compose ps $svc
          } else {
            Write-Error "Compose not available."
          }
          Write-Host "`nRecent logs:"
          docker logs --tail 60 $svc 2>$null || Write-Warning "No logs yet."

      - name: Diagnostic dump
        shell: pwsh
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: |
          $svc = $Env:SERVICE_NAME
          Write-Host "Container inspect:"
          docker inspect $svc 2>$null | Select-Object -First 1
          Write-Host "`nList containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          Write-Host "`nCompose config (first 40 lines):"
          if (Test-Path "$PWD\docker-compose.yml") {
            Get-Content "$PWD\docker-compose.yml" | Select-Object -First 40
          } else {
            Write-Warning "docker-compose.yml not found in compose root."
          }

      - name: Health check
        shell: pwsh
        run: |
          $url = "http://localhost:8080/"
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri $url
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 4
            }
          }
          if (-not $ok) {
            Write-Warning "Health failed; dumping full logs:"
            docker logs $Env:SERVICE_NAME 2>$null
            Write-Error "Service not healthy."
          }

      - name: Summary
        shell: pwsh
        run: |
          $svc = $Env:SERVICE_NAME
          docker ps --filter "name=$svc" | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY
          docker logs --tail 30 $svc 2>$null | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY