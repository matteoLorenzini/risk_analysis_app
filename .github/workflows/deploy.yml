name: Deploy Local (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-selfhosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Env summary
        shell: pwsh
        run: |
          $PSVersionTable
          where.exe docker 2>$null
          docker version || echo "Docker not available"
          docker compose version || echo "Compose plugin not available"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync runtime-data
        shell: pwsh
        run: |
            $composeRoot = 'C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main'
            $target = Join-Path $composeRoot 'runtime-data'
            if (!(Test-Path $target)) { New-Item -ItemType Directory -Path $target | Out-Null }
            $ErrorActionPreference = 'Continue'
            function SyncDir($src,$dst){
              if (Test-Path $src){
                robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
                $code = $LASTEXITCODE
                if ($code -ge 8){ Write-Error "Robocopy failed ($code) for $src" }
              }
            }
            SyncDir "$PWD\data"   (Join-Path $target 'data')
            SyncDir "$PWD\config" (Join-Path $target 'config')
            SyncDir "$PWD\ldp"    (Join-Path $target 'ldp')
            SyncDir "$PWD\file"   (Join-Path $target 'file')
            SyncDir "$PWD\images" (Join-Path $target 'images')
            Write-Host "Runtime data sync complete."

      - name: Pull image
        shell: pwsh
        working-directory: C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main
        continue-on-error: true
        run: |
          docker compose pull researchspace

      - name: Restart service
        shell: pwsh
        working-directory: C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main
        run: |
          docker compose up -d --no-deps --force-recreate researchspace
          docker compose ps researchspace
          docker logs --tail 100 researchspace 2>$null

      - name: Health check (basic)
        shell: pwsh
        run: |
          $urls=@("http://localhost:8080/")
          $ok=$false
          for($i=0;$i -lt 60;$i++){
            foreach($u in $urls){
              try{
                $r=Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri $u
                if($r.StatusCode -eq 200){$ok=$true;break}
              }catch{}
            }
            if($ok){break}
            Start-Sleep -Seconds 5
          }
          if(-not $ok){
            Write-Warning "Health check failed, dumping container logs."
            docker logs researchspace 2>$null
            Write-Error "Service not healthy after 5 min."
          }

      - name: Summary
        shell: pwsh
        run: |
          docker compose ps researchspace | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY