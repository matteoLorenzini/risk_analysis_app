name: Deploy Local (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        shell: powershell
        run: |
          echo "COMPOSE_ROOT=C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main" >> $Env:GITHUB_ENV
          # Correct path (includes researchspace subfolder per compose config)
          echo "RUNTIME_TARGET=C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main\researchspace\runtime-data" >> $Env:GITHUB_ENV
          echo "SERVICE_NAME=researchspace" >> $Env:GITHUB_ENV

      - name: Sync runtime-data
        shell: powershell
        run: |
          $rt = $Env:RUNTIME_TARGET
          if (!(Test-Path $rt)) { New-Item -ItemType Directory -Path $rt -Force | Out-Null }
          function SyncDir($src,$dst){
            if (Test-Path $src){
              Write-Host "Sync $src -> $dst"
              robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
              $LASTEXITCODE = 0
            }
          }
          SyncDir "$PWD\data"   (Join-Path $rt 'data')
          SyncDir "$PWD\config" (Join-Path $rt 'config')
          SyncDir "$PWD\ldp"    (Join-Path $rt 'ldp')
          if (Test-Path "$PWD\file")   { SyncDir "$PWD\file"   (Join-Path $rt 'file') }
          if (Test-Path "$PWD\images") { SyncDir "$PWD\images" (Join-Path $rt 'images') }
          Write-Host "Runtime-data synced to $rt"

      - name: Pull latest image
        shell: powershell
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: |
          docker compose pull $Env:SERVICE_NAME
          Write-Host "Image pull complete"

      - name: Restart service (force recreate)
        shell: powershell
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: |
          docker compose up -d --force-recreate --no-deps $Env:SERVICE_NAME
          Start-Sleep -Seconds 5
          docker compose ps $Env:SERVICE_NAME
          $cid = docker compose ps -q $Env:SERVICE_NAME
          Write-Host "Container recreated: $cid"
          docker logs --tail 60 $cid

      - name: Health check
        shell: powershell
        run: |
          $url = "http://localhost:10214/"
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri $url
              if ($r.StatusCode -eq 200) { 
                Write-Host "Service healthy"
                $ok = $true
                break 
              }
            } catch {
              Start-Sleep -Seconds 4
            }
          }
          if (-not $ok) {
            Write-Warning "Health check failed"
            docker logs $Env:SERVICE_NAME
          }

      - name: Summary
        shell: powershell
        run: |
          docker compose ps $Env:SERVICE_NAME | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY
          docker logs --tail 30 $Env:SERVICE_NAME | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY