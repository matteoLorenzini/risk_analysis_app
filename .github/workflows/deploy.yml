name: Deploy Local (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pull_image:
        description: 'Run docker compose pull before restart'
        required: true
        default: 'false'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        shell: powershell
        run: |
          echo "COMPOSE_ROOT=C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main" >> $Env:GITHUB_ENV
          echo "SERVICE_NAME=researchspace" >> $Env:GITHUB_ENV
          echo "PULL_IMAGE=${{ github.event.inputs.pull_image }}" >> $Env:GITHUB_ENV
          # Adjust if your compose expects researchspace\runtime-data instead of runtime-data:
          echo "RUNTIME_TARGET=C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main\runtime-data" >> $Env:GITHUB_ENV

      - name: Sync runtime-data
        shell: powershell
        run: |
          $rt = $Env:RUNTIME_TARGET
          if (!(Test-Path $rt)) { New-Item -ItemType Directory -Path $rt | Out-Null }
          function SyncDir($src,$dst){
            if (Test-Path $src){
              robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
              $LASTEXITCODE = 0
            }
          }
          SyncDir "$PWD\data"   (Join-Path $rt 'data')
          SyncDir "$PWD\config" (Join-Path $rt 'config')
          SyncDir "$PWD\ldp"    (Join-Path $rt 'ldp')
          if (Test-Path "$PWD\file")   { SyncDir "$PWD\file"   (Join-Path $rt 'file') }
          if (Test-Path "$PWD\images") { SyncDir "$PWD\images" (Join-Path $rt 'images') }
          Write-Host "Runtime-data sync complete."
          Get-ChildItem $rt | Select-Object Name

      - name: Optional pull
        if: env.PULL_IMAGE == 'true'
        shell: powershell
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: docker compose pull $Env:SERVICE_NAME || Write-Warning "Pull failed."

      - name: Restart service
        shell: powershell
        working-directory: ${{ env.COMPOSE_ROOT }}
        run: |
          docker compose up -d --no-deps --force-recreate $Env:SERVICE_NAME
          docker compose ps $Env:SERVICE_NAME
          docker inspect $Env:SERVICE_NAME --format "Image={{.Config.Image}}" | Write-Host

      - name: Verify mounts
        shell: powershell
        run: |
          docker inspect $Env:SERVICE_NAME --format "{{json .Mounts}}" | Write-Host

      - name: Summary
        shell: powershell
        run: docker compose ps $Env:SERVICE_NAME | Out-String | Add-Content $Env:GITHUB_STEP_SUMMARY