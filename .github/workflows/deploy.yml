name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set paths
        shell: powershell
        run: |
          $composeRoot = "C:\Users\matte\researchspace-docker-desktop-main\researchspace-docker-desktop-main"
          $runtimeTarget = Join-Path $composeRoot "researchspace\runtime-data"
          
          "COMPOSE_ROOT=$composeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_TARGET=$runtimeTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SERVICE_NAME=researchspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync runtime data
        shell: powershell
        run: |
          $target = $env:RUNTIME_TARGET
          Write-Host "Syncing to: $target"
          
          if (!(Test-Path $target)) { 
            New-Item -ItemType Directory -Path $target -Force | Out-Null 
          }
          
          robocopy "$PWD\data" "$target\data" /MIR /NFL /NDL /NJH /NJS /NP
          robocopy "$PWD\config" "$target\config" /MIR /NFL /NDL /NJH /NJS /NP
          robocopy "$PWD\ldp" "$target\ldp" /MIR /NFL /NDL /NJH /NJS /NP
          
          if (Test-Path "$PWD\file") { 
            robocopy "$PWD\file" "$target\file" /MIR /NFL /NDL /NJH /NJS /NP 
          }
          if (Test-Path "$PWD\images") { 
            robocopy "$PWD\images" "$target\images" /MIR /NFL /NDL /NJH /NJS /NP 
          }
          
          if ($LASTEXITCODE -gt 7) { 
            Write-Error "Sync failed with code $LASTEXITCODE"
            exit 1
          }
          $global:LASTEXITCODE = 0
          
          Write-Host "Sync complete"

      - name: Verify compose file
        shell: powershell
        run: |
          $composePath = Join-Path $env:COMPOSE_ROOT "docker-compose.yml"
          if (!(Test-Path $composePath)) {
            Write-Error "docker-compose.yml not found at: $composePath"
            exit 1
          }
          Write-Host "Found docker-compose.yml"

      - name: Pull latest image
        shell: powershell
        run: |
          Push-Location $env:COMPOSE_ROOT
          try {
            Write-Host "Pulling latest image..."
            docker compose pull $env:SERVICE_NAME
            Write-Host "Image pulled successfully"
          } finally {
            Pop-Location
          }

      - name: Restart container
        shell: powershell
        run: |
          Push-Location $env:COMPOSE_ROOT
          try {
            Write-Host "Stopping existing container..."
            docker compose stop $env:SERVICE_NAME
            
            Write-Host "Starting container with new configuration..."
            docker compose up -d --force-recreate --no-deps $env:SERVICE_NAME
            
            Start-Sleep -Seconds 10
            
            $cid = docker compose ps -q $env:SERVICE_NAME
            Write-Host "Container ID: $cid"
            
            docker compose ps $env:SERVICE_NAME
            
            Write-Host "`nInitial container logs:"
            docker logs --tail 50 $cid
          } finally {
            Pop-Location
          }

      - name: Wait for service startup
        shell: powershell
        run: |
          Push-Location $env:COMPOSE_ROOT
          try {
            $url = "http://localhost:10214/"
            $maxWaitMinutes = 5
            $maxAttempts = $maxWaitMinutes * 60 / 4  # Check every 4 seconds
            $healthy = $false
            
            Write-Host "Waiting for service to be ready at $url..."
            Write-Host "This may take several minutes for first startup..."
            
            for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3 -ErrorAction Stop
                if ($response.StatusCode -eq 200) {
                  Write-Host "Service is healthy! (attempt $i)"
                  $healthy = $true
                  break
                }
              } catch {
                $elapsed = [math]::Round(($i * 4) / 60, 1)
                Write-Host "[$elapsed min] Waiting for service... (attempt $i/$maxAttempts)"
                
                # Show logs every 30 seconds
                if ($i % 8 -eq 0) {
                  $cid = docker compose ps -q $env:SERVICE_NAME
                  Write-Host "`nRecent logs:"
                  docker logs --tail 20 $cid 2>&1 | Select-Object -Last 10
                }
                
                Start-Sleep -Seconds 4
              }
            }
            
            if (-not $healthy) {
              Write-Warning "Service did not become healthy within $maxWaitMinutes minutes"
              $cid = docker compose ps -q $env:SERVICE_NAME
              Write-Host "`nFull container logs:"
              docker logs $cid
              Write-Host "`nContainer status:"
              docker compose ps $env:SERVICE_NAME
              Write-Host "`nContainer inspect:"
              docker inspect $cid --format "{{.State.Status}} - {{.State.Health.Status}}"
            }
          } finally {
            Pop-Location
          }

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          Push-Location $env:COMPOSE_ROOT
          try {
            "## Deployment Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            
            "### Container Status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            docker compose ps $env:SERVICE_NAME 2>&1 | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "### Recent Logs" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            # Get container ID first
            $cid = docker compose ps -q $env:SERVICE_NAME
            if ($cid) {
              docker logs --tail 50 $cid 2>&1 | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            } else {
              "No container found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $url = "http://localhost:10214/"
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3 -ErrorAction Stop
              "### Health Status: Healthy" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            } catch {
              "### Health Status: Not responding" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          } catch {
            Write-Warning "Failed to generate summary: $_"
            exit 0
          } finally {
            Pop-Location
          }
