<semantic-search
  categories='{
    "<http://www.siriusplatform-risk-assessment/field/min_score>": [{
      "kind": "numeric-range",
      "datatype": "http://www.w3.org/2001/XMLSchema#decimal",
      "queryPattern": "
        {
          $subject ?__relation__ ?score .
          FILTER(xsd:decimal(?score) >= xsd:decimal(?__numericRangeBeginValue__)) .
          FILTER(xsd:decimal(?score) <= xsd:decimal(?__numericRangeEndValue__)) .
        }
      "
    }]
  }'

  search-profile='{
    "categories":[
      { "iri":"<http://www.cidoc-crm.org/cidoc-crm/E5_Event>", "label":"Event", "thumbnail":"../images/fcs/events.svg" },
      { "iri":"<http://www.cidoc-crm.org/cidoc-crm/E39_Actor>", "label":"Agent", "thumbnail":"../images/fcs/actors.svg" },
      { "iri":"<http://www.cidoc-crm.org/cidoc-crm/E18_Physical_Thing>", "label":"Site", "thumbnail":"../images/fcs/places.svg" },
      { "iri":"<http://www.cidoc-crm.org/extensions/crmsci/S21_Measurement>", "label":"Magnitude", "thumbnail":"../images/fcs/things.svg" }
    ],
    "relations":[
      { "iri":"<http://www.siriusplatform-risk-assessment/field/agent>", "label":"Agent", "hasDomain":"<http://www.cidoc-crm.org/cidoc-crm/E5_Event>", "hasRange":"<http://www.cidoc-crm.org/cidoc-crm/E39_Actor>" },
      { "iri":"<http://www.siriusplatform-risk-assessment/field/site>", "label":"Site", "hasDomain":"<http://www.cidoc-crm.org/cidoc-crm/E5_Event>", "hasRange":"<http://www.cidoc-crm.org/cidoc-crm/E18_Physical_Thing>" },
      { "iri":"<http://www.siriusplatform-risk-assessment/field/min_score>", "label":"Magnitude Range", "hasDomain":"<http://www.cidoc-crm.org/cidoc-crm/E5_Event>", "hasRange":"<http://www.w3.org/2001/XMLSchema#decimal>" }
    ]
  }'

  relations='{
    "<http://www.siriusplatform-risk-assessment/field/agent>": [{
      "kind":"resource",
      "queryPattern":"{ $subject base:P11_had_participant ?__value__ . ?__value__ a base:E39_Actor . }"
    }],
    "<http://www.siriusplatform-risk-assessment/field/site>": [{
      "kind":"resource",
      "queryPattern":"{ $subject base:P31_has_modified ?__value__ . ?__value__ a base:E18_Physical_Thing . }"
    }],
    "<http://www.siriusplatform-risk-assessment/field/min_score>": [{
      "kind":"numeric-range",
      "datatype":"http://www.w3.org/2001/XMLSchema#decimal",
      "queryPattern":"{
        $subject a base:E5_Event .
        $subject base:P39i_was_measured_by ?magnitude .
        ?magnitude a crmsci:S21_Measurement ;
                   base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
                   base:P40_observed_dimension ?dimension .
        ?dimension base:P90_has_value ?score .
        FILTER(xsd:decimal(?score) >= xsd:decimal(?__numericRangeBeginValue__)) .
        FILTER(xsd:decimal(?score) <= xsd:decimal(?__numericRangeEndValue__)) .
      }"
    }]
  }'
  >

  <semantic-search-query-keyword domain='<http://www.cidoc-crm.org/cidoc-crm/E5_Event>' query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    SELECT ?subject WHERE {
      ?subject a crm:E5_Event .
      OPTIONAL { ?subject rdfs:label ?label . FILTER REGEX(STR(?label), ?__token__, "i") }
    }' default-query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    SELECT DISTINCT ?subject ?label WHERE { ?subject a crm:E5_Event }' debounce=400>
  </semantic-search-query-keyword>

  <div data-flex-layout="row stretch-stretch">
    <div data-flex-self="size-1of3" style="flex: 0 0 20px;">
      <semantic-search-facet
        value-relations='{
          "<http://www.siriusplatform-risk-assessment/field/agent>": { "kind":"resource", "valuesQuery":"PREFIX base: <http://www.cidoc-crm.org/cidoc-crm/> SELECT ?iri ?label WHERE { $subject base:P11_had_participant ?iri . ?iri a base:E39_Actor . OPTIONAL{ ?iri rdfs:label ?label } }" },
          "<http://www.siriusplatform-risk-assessment/field/site>": { "kind":"resource", "valuesQuery":"PREFIX base: <http://www.cidoc-crm.org/cidoc-crm/> SELECT ?iri ?label WHERE { $subject base:P31_has_modified ?iri . ?iri a base:E18_Physical_Thing . OPTIONAL{ ?iri rdfs:label ?label } }" },
          "<http://www.siriusplatform-risk-assessment/field/min_score>": { "kind":"numeric-range", "valuesQuery":"PREFIX base: <http://www.cidoc-crm.org/cidoc-crm/> PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/> PREFIX xsd: <http://www.w3.org/2001/XMLSchema#> SELECT ?numericRangeBeginValue ?numericRangeEndValue WHERE { $subject base:P39i_was_measured_by ?magnitude . ?magnitude crmsci:P40_observed_dimension ?dimension . ?dimension base:P90_has_value ?val . BIND(xsd:decimal(?val) AS ?numericRangeBeginValue) BIND(xsd:decimal(?val) AS ?numericRangeEndValue) }" }
        }'>
      </semantic-search-facet>
    </div>

    <semantic-search-result-holder>
      <div data-flex-self="md-full">
        <semantic-search-result>
          <mp-sparql-result-counts id="query-count" query="SELECT DISTINCT * {}"></mp-sparql-result-counts>
        </semantic-search-result>

        <bs-tabs unmount-on-exit=true id="search-results" animation=false>
          <bs-tab event-key="1" title="List">
            <semantic-search-result>
              <semantic-table id="event-table" query="
                PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

                SELECT DISTINCT ?subject ?label ?date ?site ?siteLabel WHERE {
                  ?subject a crm:E5_Event .
                  OPTIONAL { ?subject rdfs:label ?label . }
                  OPTIONAL { ?subject crm:P4_has_time-span ?timespan . ?timespan crm:P82a_begin_of_the_begin ?date . }
                  OPTIONAL { ?subject crm:P31_has_modified ?site . OPTIONAL { ?site rdfs:label ?siteLabel } }
                } ORDER BY ?label
              " column-configuration='[
                { "displayName":"Event", "cellTemplate":"<semantic-link iri=\"{{subject.value}}\">{{label.value}}</semantic-link>" },
                { "displayName":"Date",  "cellTemplate":"<div>{{date.value}}</div>" },
                { "displayName":"Site",  "cellTemplate":"<semantic-link iri=\"{{site.value}}\">{{siteLabel.value}}</semantic-link>" }
              ]' options='{"showFilter":true, "resultsPerPage":10}'>
              </semantic-table>
            </semantic-search-result>
          </bs-tab>
        </bs-tabs>
      </div>
    </semantic-search-result-holder>
  </div>
</semantic-search>
