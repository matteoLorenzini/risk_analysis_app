[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-event'}}" style="min-height: 260px;">
        <div class="rs-resource-header-content-container" style="padding:18px;">
          <div style="flex:1;">
            <div class="rs-resource-header--title">
              <mp-label iri='[[this]]'></mp-label>
            </div>
            <div style="margin-top:8px;">
              <mp-copy-to-clipboard text='[[this]]'></mp-copy-to-clipboard>
            </div>
          </div>
        </div>
      </div>

      <bs-tab-container id="event-tabs" class="rs-resource-tabs" default-active-key="event-details">
        <bs-nav bs-style="tabs">
          <bs-nav-item event-key="event-details">Event Details</bs-nav-item>
        </bs-nav>
        <bs-tab-content>
          <bs-tab-pane event-key="event-details">
            <div class="rs-resource-tab-container">
              <hr class="rs-resource-section--headerLine">
              <span class="h1 rs-resource-section--header">Event Information</span>

              <div class="rs-resource-data-table" style="margin-top:12px;">
                <mp-field-visualization
                  subject='[[this]]'
                  fields='[[fieldDefinitions event="http://www.siriusplatform-risk-assessment/field/event" agent="http://www.siriusplatform-risk-assessment/field/agent_inverse" site="http://www.siriusplatform-risk-assessment/field/site" min_score="http://www.siriusplatform-risk-assessment/field/min_score"]]'
                  template='{{> template}}'>
                  <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                </mp-field-visualization>
              </div>

            </div>
          </bs-tab-pane>
        </bs-tab-content>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
