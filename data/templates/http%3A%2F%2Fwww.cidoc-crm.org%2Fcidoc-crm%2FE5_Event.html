[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="sites-modified">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="sites-modified">Sites Affected</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="sites-modified">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Sites Modified and Associated Risk</span>
                </div>
                
                <div style="margin-top:40px;">
                  <h2 class="h2" style="margin-bottom:15px;">Sites Affected by this Event</h2>

<semantic-table
  id="event-sites-table"

  query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?site ?site_label
       (SAMPLE(?a_v1)      AS ?a_val1)
       (SAMPLE(?a_v2)      AS ?a_val2)
       (SAMPLE(?a_v3)      AS ?a_val3)
       (SAMPLE(?a_note)    AS ?a_desc)
       (SAMPLE(?b_v1)      AS ?b_val1)
       (SAMPLE(?b_v2)      AS ?b_val2)
       (SAMPLE(?b_v3)      AS ?b_val3)
       (SAMPLE(?b_note)    AS ?b_desc)
       (SAMPLE(?c_v1)      AS ?c_val1)
       (SAMPLE(?c_v2)      AS ?c_val2)
       (SAMPLE(?c_v3)      AS ?c_val3)
       (SAMPLE(?c_note)    AS ?c_desc)
       (SAMPLE(?mag_min)   AS ?magnitude_min_score)
       (SAMPLE(?mag_max)   AS ?magnitude_max_score)
       (SAMPLE(?unc_min)   AS ?uncertainty_min_score)
       (SAMPLE(?unc_max)   AS ?uncertainty_max_score)
WHERE {
  # bind current Event
  BIND(<[[this]]> AS ?event)
  ?event a base:E5_Event .

  # sites affected by the event
  ?event base:P31_has_modified ?site .
  ?site a base:E18_Physical_Thing .
  OPTIONAL { ?site rdfs:label ?site_label }

  # --- Scale A aggregated per event+site ---
  OPTIONAL {
    { SELECT ?event ?site
        (SAMPLE(?v1) AS ?a_v1) (SAMPLE(?v2) AS ?a_v2) (SAMPLE(?v3) AS ?a_v3) (SAMPLE(?noteA) AS ?a_note)
      WHERE {
        ?event base:P39i_was_measured_by ?measA .
        ?measA a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
        OPTIONAL { ?measA base:P129_is_about ?site }                # prefer measurements about the site
        OPTIONAL { ?measA base:P40_observed_dimension ?dA1 . ?dA1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measA base:P40_observed_dimension ?dA2 . ?dA2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measA base:P40_observed_dimension ?dA3 . ?dA3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measA base:P3_has_note ?noteA }
        # ensure association to site rows
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site
    }
  }

  # --- Scale B aggregated per event+site ---
  OPTIONAL {
    { SELECT ?event ?site
        (SAMPLE(?v1) AS ?b_v1) (SAMPLE(?v2) AS ?b_v2) (SAMPLE(?v3) AS ?b_val3) (SAMPLE(?noteB) AS ?b_note)
      WHERE {
        ?event base:P39i_was_measured_by ?measB .
        ?measB a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
        OPTIONAL { ?measB base:P129_is_about ?site }
        OPTIONAL { ?measB base:P40_observed_dimension ?dB1 . ?dB1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measB base:P40_observed_dimension ?dB2 . ?dB2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measB base:P40_observed_dimension ?dB3 . ?dB3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measB base:P3_has_note ?noteB }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site
    }
  }

  # --- Scale C aggregated per event+site ---
  OPTIONAL {
    { SELECT ?event ?site
        (SAMPLE(?v1) AS ?c_v1) (SAMPLE(?v2) AS ?c_v2) (SAMPLE(?v3) AS ?c_val3) (SAMPLE(?noteC) AS ?c_note)
      WHERE {
        ?event base:P39i_was_measured_by ?measC .
        ?measC a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
        OPTIONAL { ?measC base:P129_is_about ?site }
        OPTIONAL { ?measC base:P40_observed_dimension ?dC1 . ?dC1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measC base:P40_observed_dimension ?dC2 . ?dC2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measC base:P40_observed_dimension ?dC3 . ?dC3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measC base:P3_has_note ?noteC }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site
    }
  }

  # --- Magnitude min/max per event+site (P90_has_value used) ---
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?minM) AS ?mag_min) (SAMPLE(?maxM) AS ?mag_max)
      WHERE {
        ?event base:P39i_was_measured_by ?mag .
        ?mag a crmsci:S21_Measurement ;
             base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
        OPTIONAL { ?mag base:P129_is_about ?site }
        OPTIONAL { ?mag base:P40_observed_dimension ?md1 . ?md1 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?minM . FILTER(STRSTARTS(STR(?md1), "https://w3id.org/sirius/magnitude_score_min")) }
        OPTIONAL { ?mag base:P40_observed_dimension ?md2 . ?md2 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?maxM . FILTER(STRSTARTS(STR(?md2), "https://w3id.org/sirius/magnitude_score_max")) }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site
    }
  }

  # --- Uncertainty min/max per event+site (try P90_has_value first, fallback to rdfs:label if used) ---
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?umin) AS ?unc_min) (SAMPLE(?umax) AS ?unc_max)
      WHERE {
        ?event base:P39i_was_measured_by ?unc .
        ?unc a crmsci:S21_Measurement ;
             base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
        OPTIONAL { ?unc base:P129_is_about ?site }
        OPTIONAL { ?unc base:P40_observed_dimension ?ud1 . ?ud1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?umin . FILTER(STRSTARTS(STR(?ud1), "https://w3id.org/sirius/uncertainty_min")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ud2 . ?ud2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?umax . FILTER(STRSTARTS(STR(?ud2), "https://w3id.org/sirius/uncertainty_max")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ul1 . ?ul1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?ulabelMin . FILTER(STRSTARTS(STR(?ul1), "https://w3id.org/sirius/uncertainty_min")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ul2 . ?ul2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?ulabelMax . FILTER(STRSTARTS(STR(?ul2), "https://w3id.org/sirius/uncertainty_max")) }
        BIND(COALESCE(?umin, ?ulabelMin) AS ?umin)
        BIND(COALESCE(?umax, ?ulabelMax) AS ?umax)
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site
    }
  }

}
GROUP BY ?site ?site_label
ORDER BY ?site_label
'
  column-configuration='[
    { "displayName": "Affected Site (E18)", "cellTemplate": "{{> siteLinkCell}}" },
    { "displayName": "Risk Description (E89)",  "cellTemplate": "{{> riskDescCell}}" },
    { "displayName": "Global Score (A-V1)",     "cellTemplate": "{{a_val1.value}}"},
    { "displayName": "Global Magnitude (Min)",  "cellTemplate": "{{magnitude_min.value}}"},
    { "displayName": "Global Uncertainty (Min)",  "cellTemplate": "{{uncertainty_min.value}}"}
  ]'
  options='{"showFilter": true, "resultsPerPage": 50, "stickyHeader": true}'>
  <template id="siteLinkCell">
    {{#if subject.value}}
      <semantic-link iri="{{subject.value}}">
        <span class="pill">{{site_label.value}}</span>
      </semantic-link>
    {{else}}
      <span class="pill">Unknown Site</span>
    {{/if}}
  </template>
  
  <template id="riskDescCell">
    {{#if risk_desc.value}}
      <span class="risk-note">{{risk_desc.value}}</span>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>
  </semantic-table>

<style>
  #event-sites-table .pill {
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #ccc;
    background:#f9f9f9;
  }
  #event-sites-table .risk-note {
    font-size:0.95em;
    font-style: italic;
    color: #333;
  }
  #event-sites-table .empty{ text-align:center; opacity:.5; }
</style>

                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>

    </div>
  </template>

</with-types>
[[/inline]]
[[> resource]]
