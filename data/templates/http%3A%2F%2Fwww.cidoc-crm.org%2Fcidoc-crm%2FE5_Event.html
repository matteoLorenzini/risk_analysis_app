[[#*inline "resource"]]

<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">

      <!-- HEADER -->
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">

            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>

            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>

          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>

              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">

        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event</bs-nav-item>
          </bs-nav>

          <bs-tab-content animation="true">
            <bs-tab-pane event-key="event-details">

              <div class="rs-resource-tab-container">

                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event</span>
                </div>

                <!-- SEMANTIC TABLE -->
                <semantic-table
                  id="event-site-table"
                  query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?event ?event_label ?site ?siteLabel ?risk_desc
  ?a1 ?a2 ?a3 ?a_note
  ?b1 ?b2 ?b3 ?b_note
  ?c1 ?c2 ?c3 ?c_note
  ?magnitude ?uncertainty
WHERE {
  VALUES ?event { <[[this]]> }

  ?event a base:E5_Event ;
         rdfs:label ?event_label ;
         base:P31_has_modified ?site .

  OPTIONAL { ?site rdfs:label ?siteLabel }

  OPTIONAL {
    ?ra a base:E89_Propositional_Object ;
        base:P129_is_about ?event ;
        base:P129_is_about ?site .
    OPTIONAL { ?ra base:P3_has_note ?risk_desc }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mA .
    ?mA base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
    OPTIONAL { ?mA base:P40_observed_dimension ?d1 .
               ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?a1 . }
    OPTIONAL { ?mA base:P40_observed_dimension ?d2 .
               ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?a2 . }
    OPTIONAL { ?mA base:P40_observed_dimension ?d3 .
               ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?a3 . }
    OPTIONAL { ?mA base:P3_has_note ?a_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mB .
    ?mB base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
    OPTIONAL { ?mB base:P40_observed_dimension ?db1 .
               ?db1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?b1 . }
    OPTIONAL { ?mB base:P40_observed_dimension ?db2 .
               ?db2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?b2 . }
    OPTIONAL { ?mB base:P40_observed_dimension ?db3 .
               ?db3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?b3 . }
    OPTIONAL { ?mB base:P3_has_note ?b_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mC .
    ?mC base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
    OPTIONAL { ?mC base:P40_observed_dimension ?dc1 .
               ?dc1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?c1 . }
    OPTIONAL { ?mC base:P40_observed_dimension ?dc2 .
               ?dc2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?c2 . }
    OPTIONAL { ?mC base:P40_observed_dimension ?dc3 .
               ?dc3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?c3 . }
    OPTIONAL { ?mC base:P3_has_note ?c_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mag .
    ?mag base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
         base:P40_observed_dimension ?mD .
    ?mD base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
        base:P90_has_value ?magnitude .
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?unc .
    ?unc base:P2_has_type <https://w3id.org/sirius/type/uncertainty> ;
         base:P40_observed_dimension ?uD .
    ?uD base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
        rdfs:label ?uncertainty .
  }
}
ORDER BY ?siteLabel
'
                  column-configuration='[
                    {"displayName":"Event","cellTemplate":"{{> eventCell}}"},
                    {"displayName":"Site","cellTemplate":"{{> siteCell}}"},
                    {"displayName":"Risk Description","cellTemplate":"{{> riskCell}}"},
                    {"displayName":"Scale A","cellTemplate":"{{> scaleTripleColored v1=a1 v2=a2 v3=a3 note=a_note}}"},
                    {"displayName":"Scale B","cellTemplate":"{{> scaleTripleColored v1=b1 v2=b2 v3=b3 note=b_note}}"},
                    {"displayName":"Scale C","cellTemplate":"{{> scaleTripleColored v1=c1 v2=c2 v3=c3 note=c_note}}"},
                    {"displayName":"Magnitude","cellTemplate":"{{> coloredValue value=magnitude}}"},
                    {"displayName":"Uncertainty","cellTemplate":"{{> coloredValue value=uncertainty}}"}
                  ]'
                  options='{"showFilter": true, "resultsPerPage": 20}'>


      <!-- ====== PARTIALS INSIDE SEMANTIC-TABLE (MODE A) ====== -->

      <template id="eventCell">
        {{#if event_label.value}}
          <span class="pill">{{event_label.value}}</span>
        {{else}}
          <span class="empty">—</span>
        {{/if}}
      </template>

      <template id="siteCell">
        {{#if siteLabel.value}}
          <span class="pill">{{siteLabel.value}}</span>
        {{else}}
          <span class="mono">{{site.value}}</span>
        {{/if}}
      </template>

      <template id="riskCell">
        {{#if risk_desc.value}}
          <div class="note">{{risk_desc.value}}</div>
        {{else}}
          <span class="empty">—</span>
        {{/if}}
      </template>

      <!-- colored numeric value -->
      <template id="coloredValue">
        {{#if value.value}}
          <span style="
            padding:3px 7px;
            border-radius:4px;
            color:#000;
            background-color:
              {{#if (gte value.value 7)}}#ff6666{{else}}
              {{#if (gte value.value 4)}}#ffdd57{{else}}
              #77dd77{{/if}}{{/if}};">
            {{value.value}}
          </span>
        {{else}}
          <span class="empty">—</span>
        {{/if}}
      </template>

      <!-- triple scale colored -->
      <template id="scaleTripleColored">
        <div>
          {{#if v1.value}}{{> coloredValue value=v1}}{{/if}}
          {{#if v2.value}}{{> coloredValue value=v2}}{{/if}}
          {{#if v3.value}}{{> coloredValue value=v3}}{{/if}}
          {{#if note.value}}<div class="note">{{note.value}}</div>{{/if}}
        </div>
      </template>

    </semantic-table>

  </div>

</bs-tab-pane>
</bs-tab-content>

</div>
</bs-tab-container>

</div>
</template>

</with-types>

[[/inline]]
[[> resource]]
