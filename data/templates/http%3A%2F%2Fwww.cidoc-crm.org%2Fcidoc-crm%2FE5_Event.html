[[#*inline "resource"]]

  <with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
    <template id='page'>
      <div class="rs-resource-container">
        <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
          <div class="rs-resource-header-topContainer">
            <div class="rs-resource-header-topButtons">
              <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
                <button type="button" title="Author Resource in Knowledge Map">
                  <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
                </button>
              </semantic-link-container>
              <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
                <button type="button" title="Resource Details">
                  <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
                </button>
              </mp-event-trigger>
              <semantic-link-container uri='http://www.researchspace.org/resource/ResourceContentEditE18' urlqueryparam-resource='[[this]]'>
                <button type="button" title="Author Resource in Form">
                  <rs-icon icon-type="rounded" icon-name="edit_note" symbol="true"></rs-icon>
                </button>
              </semantic-link-container>
              <a href='/resource/?uri=http://www.researchspace.org/resource/ResourceContentEditE18&resource=[[this]]' title='Author Resource in Form'>
                <button type="button">
                  <rs-icon icon-type="rounded" icon-name="edit_note" symbol="true"></rs-icon>
                </button>
              </a>
            </div>
          </div>

          <div class="rs-resource-header-content-container">
            <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
              <div class="rs-resource-header--singletitle">
                <div class="rs-resource-header--title" style="text-transform: capitalize;">
                  <mp-label iri='[[this]]'></mp-label>
                </div>
                <div style="display: flex; gap: 12px; align-items:center;">
                  <mp-copy-to-clipboard text='[[this]]'>
                    <div class="rs-copy-IRI">Copy IRI</div>
                  </mp-copy-to-clipboard>
                  <div class="statements">Statements</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
          <div>
            <bs-nav bs-style="tabs">
              <bs-nav-item event-key="event-details">Event</bs-nav-item>
            </bs-nav>
            <bs-tab-content animation="true">
              <bs-tab-pane event-key="event-details">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Event</span>
                  </div>
                  <div class="rs-resource-data-table">
                    
                    <semantic-table id="site-events-table" query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?event 
  ?site 
  ?uncertainty_score ?magnitude_value
  ?a_val1 ?a_val2 ?a_val3 ?a_note
  ?b_val1 ?b_val2 ?b_val3 ?b_note
  ?c_val1 ?c_val2 ?c_val3 ?c_note
  ?eventNote
WHERE {

  #################################################################
  # 1) CURRENT EVENT + ITS TYPE
  #################################################################
  BIND(<[[this]]> AS ?currentEvent)

  ?currentEvent a base:E5_Event ;
                base:P2_has_type ?eventType .

  #################################################################
  # 2) RETRIEVE ALL EVENTS OF SAME TYPE
  #################################################################
  ?event a base:E5_Event ;
         base:P2_has_type ?eventType ;
         rdfs:label ?event_name .

  #################################################################
  # 3) SITE IMPACTED BY THE EVENT
  #################################################################
  OPTIONAL {
    ?event base:P31_has_modified ?site .
    OPTIONAL { ?site rdfs:label ?siteLabel }
  }

  #################################################################
  # 4) UNCERTAINTY SCORE + NOTES
  #################################################################
  OPTIONAL {
    SELECT ?event (SAMPLE(?uVal) AS ?uncertainty_score)
                  (SAMPLE(?uNote) AS ?uncertainty_note)
    WHERE {
      ?event base:P39i_was_measured_by ?u .
      ?u a crmsci:S21_Measurement ;
         base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .

      OPTIONAL { ?u base:P3_has_note ?uNote }

      ?u base:P40_observed_dimension ?uDim .
      ?uDim base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
            rdfs:label ?uVal .
    }
    GROUP BY ?event
  }

  #################################################################
  # 5) MAGNITUDE SCORE + NOTES
  #################################################################
  OPTIONAL {
    SELECT ?event (SAMPLE(?mVal) AS ?magnitude_value)
                  (SAMPLE(?mNote) AS ?magnitude_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mag .
      ?mag a crmsci:S21_Measurement ;
           base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .

      OPTIONAL { ?mag base:P3_has_note ?mNote }

      ?mag base:P40_observed_dimension ?mDim .
      ?mDim base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
            base:P90_has_value ?mVal .
    }
    GROUP BY ?event
  }

  #################################################################
  # 6) SCALE A (VAL1 / VAL2 / VAL3) + NOTE
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1) AS ?a_val1)
           (SAMPLE(?v2) AS ?a_val2)
           (SAMPLE(?v3) AS ?a_val3)
           (SAMPLE(?note) AS ?a_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mA .
      ?mA base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .

      OPTIONAL { ?mA base:P3_has_note ?note }

      OPTIONAL { ?mA base:P40_observed_dimension ?d1 .
                 ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ;
                      rdfs:label ?v1 . }

      OPTIONAL { ?mA base:P40_observed_dimension ?d2 .
                 ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ;
                      rdfs:label ?v2 . }

      OPTIONAL { ?mA base:P40_observed_dimension ?d3 .
                 ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ;
                      rdfs:label ?v3 . }
    }
    GROUP BY ?event
  }

  #################################################################
  # 7) SCALE B (VAL1 / VAL2 / VAL3) + NOTE
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1b) AS ?b_val1)
           (SAMPLE(?v2b) AS ?b_val2)
           (SAMPLE(?v3b) AS ?b_val3)
           (SAMPLE(?noteB) AS ?b_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mB .
      ?mB base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .

      OPTIONAL { ?mB base:P3_has_note ?noteB }

      OPTIONAL { ?mB base:P40_observed_dimension ?db1 .
                 ?db1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ;
                      rdfs:label ?v1b . }

      OPTIONAL { ?mB base:P40_observed_dimension ?db2 .
                 ?db2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ;
                      rdfs:label ?v2b . }

      OPTIONAL { ?mB base:P40_observed_dimension ?db3 .
                 ?db3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ;
                      rdfs:label ?v3b . }
    }
    GROUP BY ?event
  }

  #################################################################
  # 8) SCALE C (VAL1 / VAL2 / VAL3) + NOTE
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1c) AS ?c_val1)
           (SAMPLE(?v2c) AS ?c_val2)
           (SAMPLE(?v3c) AS ?c_val3)
           (SAMPLE(?noteC) AS ?c_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mC .
      ?mC base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .

      OPTIONAL { ?mC base:P3_has_note ?noteC }

      OPTIONAL { ?mC base:P40_observed_dimension ?dc1 .
                 ?dc1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ;
                      rdfs:label ?v1c . }

      OPTIONAL { ?mC base:P40_observed_dimension ?dc2 .
                 ?dc2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ;
                      rdfs:label ?v2c . }

      OPTIONAL { ?mC base:P40_observed_dimension ?dc3 .
                 ?dc3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ;
                      rdfs:label ?v3c . }
    }
    GROUP BY ?event
  }

    #################################################################
  # EVENT DESCRIPTION: simple note attached to the current event
  #################################################################
  OPTIONAL {
    ?currentEvent base:P3_has_note ?event_Note .
    ?event_Note rdfs:label ?eventNote .

  }
 
}
ORDER BY ?event ?siteLabel

' column-configuration='[
  { "displayName": "Site",        "cellTemplate": "{{> siteCell}}" },
  { "displayName": "Scale A",     "cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_note}}" },
  { "displayName": "Scale B",     "cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_note}}" },
  { "displayName": "Scale C",     "cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_note}}" },
  { "displayName": "Description", "cellTemplate": "{{> descCell desc=eventNote}}" },
  { "displayName": "Magnitude",   "cellTemplate": "{{> valueRangeCell min=magnitude_value max=magnitude_value}}" },
  { "displayName": "Uncertainty", "cellTemplate": "{{> valueRangeCell min=uncertainty_score max=uncertainty_score}}" }
]'
 options='{"showFilter": true, "resultsPerPage": 10, "stickyHeader": true}'>
 
  <!-- Site label -->
  <template id="siteCell">
    {{#if siteLabel.value}}
      <semantic-link iri="{{site.value}}">{{siteLabel.value}}</semantic-link>
    {{else if siteLabel}}
      <semantic-link iri="{{site.value}}">{{siteLabel}}</semantic-link>
    {{else if site.value}}
      <semantic-link iri="{{site.value}}">{{site.value}}</semantic-link>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <!-- Generic min / max value cell (e.g., Magnitude / Uncertainty) -->
  <template id="valueRangeCell">
    {{#if min.value}}
      <div class="val"><span class="dim-label">Val.</span> {{min.value}}</div>
      {{#if max.value}}
        <div class="val"><span class="dim-label">Val.</span> {{max.value}}</div>
      {{/if}}
    {{else if min}}
      <div class="val"><span class="dim-label">Val.</span> {{min}}</div>
      {{#if max}}
        <div class="val"><span class="dim-label">Val.</span> {{max}}</div>
      {{/if}}
    {{else if max.value}}
      <div class="val"><span class="dim-label">Val.</span> {{max.value}}</div>
    {{else if max}}
      <div class="val"><span class="dim-label">Val.</span> {{max}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <!-- Scale score: Val. 1 / Val. 2 / Val. 3 + Description -->
  <template id="scaleTripleCell">
    {{#if v1.value}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v1.value}}</strong></div>
    {{else if v1}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v1}}</strong></div>
    {{/if}}

    {{#if v2.value}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v2.value}}</strong></div>
    {{else if v2}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v2}}</strong></div>
    {{/if}}

    {{#if v3.value}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v3.value}}</strong></div>
    {{else if v3}}
      <div class="val"><strong><span class="dim-label">Val.</span> {{v3}}</strong></div>
    {{/if}}

    {{#unless v1.value}}
      {{#unless v2.value}}
        {{#unless v3.value}}
          <div class="empty">—</div>
        {{/unless}}
      {{/unless}}
    {{/unless}}

    <div class="note"><span class="dim-label">Description</span>
      {{#if desc.value}}{{desc.value}}{{else if desc}}{{desc}}{{else}}—{{/if}}
    </div>
  </template>

  <!-- Risk Analysis description -->
  <template id="descCell">
    {{#if desc.value}}
      <div class="note">{{desc.value}}</div>
    {{else if desc}}
      <div class="note">{{desc}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

</semantic-table>

<style>
  /* Scoped table helpers */
  #site-events-table .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; word-break: break-all; }
  #site-events-table .pill { display:inline-block; padding:.2rem .5rem; border:1px solid #e5e7eb; border-radius:999px; }
  #site-events-table .val  { line-height: 1.25; }
  #site-events-table .note { white-space: pre-wrap; opacity:.95; line-height:1.25; margin-top:.15rem; }
  #site-events-table .empty{ text-align:center; opacity:.5; }
  #site-events-table .dim-label { font-size:.825em; text-transform:uppercase; letter-spacing:.02em; opacity:.7; margin-right:.35rem; }
  #site-events-table .muted { color:#6b7280; font-size:.875rem; margin-top:.25rem; }
</style>

                   </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
