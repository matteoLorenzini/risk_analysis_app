[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <!-- ========================================================= -->
  <!--      GLOBAL PARTIALS MUST BE OUTSIDE semantic-table       -->
  <!-- ========================================================= -->

  <template id="siteCell">
    {{#if site_label.value}}
      <div class="pill">{{site_label.value}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <template id="valueRangeCell">
    {{#if min.value}}<div>Min: {{min.value}}</div>{{/if}}
    {{#if max.value}}<div>Max: {{max.value}}</div>{{/if}}
    {{#unless min.value}}{{#unless max.value}}
      <div class="empty">—</div>
    {{/unless}}{{/unless}}
  </template>

  <template id="scaleTripleCell">
    {{#if v1.value}}<div>Val1: {{v1.value}}</div>{{/if}}
    {{#if v2.value}}<div>Val2: {{v2.value}}</div>{{/if}}
    {{#if v3.value}}<div>Val3: {{v3.value}}</div>{{/if}}
    {{#unless v1.value}}{{#unless v2.value}}{{#unless v3.value}}
      <div class="empty">—</div>
    {{/unless}}{{/unless}}{{/unless}}
    {{#if desc.value}}<div class="note">{{desc.value}}</div>{{/if}}
  </template>


  <!-- ========================================================= -->
  <!--                      PAGE TEMPLATE                        -->
  <!-- ========================================================= -->
  <template id='page'>

    <div class="rs-resource-container">

      <!-- HEADER -->
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}"
           style="min-height: 400px;">
        
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">

            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' 
                                     urlqueryparam-view='knowledge-map'
                                     urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>

            <mp-event-trigger id="details-view-trigger"
              type="Component.TemplateUpdate"
              data='{"iri": "{{iri}}"}'
              targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>

          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">

              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri="[[this]]"></mp-label>
              </div>

              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text="[[this]]">
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-clipboard>
                <div class="statements">Statements</div>
              </div>

            </div>
          </div>
        </div>

      </div><!-- END HEADER -->



      <!-- TABS -->
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">

        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event</bs-nav-item>
          </bs-nav>

          <bs-tab-content animation="true">
            <bs-tab-pane event-key="event-details">

              <div class="rs-resource-tab-container">

                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event</span>
                </div>


                <!-- ========================================================= -->
                <!--                PER-SITE METRICS TABLE                     -->
                <!-- ========================================================= -->

                <div class="rs-resource-data-table" style="margin-top:25px;">

<semantic-table
  id="event-site-table"
  query='
PREFIX crm:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci:<http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:  <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?site ?site_label
  ?a_val1 ?a_val2 ?a_val3 ?a_desc
  ?b_val1 ?b_val2 ?b_val3 ?b_desc
  ?c_val1 ?c_val2 ?c_val3 ?c_desc
  ?magnitude_min ?magnitude_max
  ?uncertainty_min ?uncertainty_max
WHERE {
  VALUES ?event { <[[this]]> }
  ?event a crm:E5_Event .
  ?event crm:P31_has_modified ?site .
  ?site a crm:E18_Physical_Thing .
  OPTIONAL { ?site rdfs:label ?site_label }

  # Scale A (measurements attached to the event, aggregated per site)
  OPTIONAL {
    {
      SELECT ?site (SAMPLE(?v1) AS ?a_val1) (SAMPLE(?v2) AS ?a_val2) (SAMPLE(?v3) AS ?a_val3) (SAMPLE(?d) AS ?a_desc)
      WHERE {
        VALUES (?site ?event) { (?site ?event) }
        ?event crm:P39i_was_measured_by ?measA .
        ?measA a crmsci:S21_Measurement ;
               crm:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
        OPTIONAL {
          ?measA crm:P40_observed_dimension ?dimension_a_1 .
          ?dimension_a_1 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ;
                         rdfs:label ?v1 .
        }
        OPTIONAL {
          ?measA crm:P40_observed_dimension ?dimension_a_2 .
          ?dimension_a_2 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ;
                         rdfs:label ?v2 .
        }
        OPTIONAL {
          ?measA crm:P40_observed_dimension ?dimension_a_3 .
          ?dimension_a_3 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ;
                         rdfs:label ?v3 .
        }
        OPTIONAL { ?measA crm:P3_has_note ?d }
      }
      GROUP BY ?site
    }
  }

  # Scale B
  OPTIONAL {
    {
      SELECT ?site (SAMPLE(?v1) AS ?b_val1) (SAMPLE(?v2) AS ?b_val2) (SAMPLE(?v3) AS ?b_val3) (SAMPLE(?d) AS ?b_desc)
      WHERE {
        VALUES (?site ?event) { (?site ?event) }
        ?event crm:P39i_was_measured_by ?measB .
        ?measB a crmsci:S21_Measurement ;
               crm:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
        OPTIONAL {
          ?measB crm:P40_observed_dimension ?dimension_b_1 .
          ?dimension_b_1 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ;
                         rdfs:label ?v1 .
        }
        OPTIONAL {
          ?measB crm:P40_observed_dimension ?dimension_b_2 .
          ?dimension_b_2 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ;
                         rdfs:label ?v2 .
        }
        OPTIONAL {
          ?measB crm:P40_observed_dimension ?dimension_b_3 .
          ?dimension_b_3 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ;
                         rdfs:label ?v3 .
        }
        OPTIONAL { ?measB crm:P3_has_note ?d }
      }
      GROUP BY ?site
    }
  }

  # Scale C
  OPTIONAL {
    {
      SELECT ?site (SAMPLE(?v1) AS ?c_val1) (SAMPLE(?v2) AS ?c_val2) (SAMPLE(?v3) AS ?c_val3) (SAMPLE(?d) AS ?c_desc)
      WHERE {
        VALUES (?site ?event) { (?site ?event) }
        ?event crm:P39i_was_measured_by ?measC .
        ?measC a crmsci:S21_Measurement ;
               crm:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
        OPTIONAL {
          ?measC crm:P40_observed_dimension ?dimension_c_1 .
          ?dimension_c_1 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ;
                         rdfs:label ?v1 .
        }
        OPTIONAL {
          ?measC crm:P40_observed_dimension ?dimension_c_2 .
          ?dimension_c_2 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ;
                         rdfs:label ?v2 .
        }
        OPTIONAL {
          ?measC crm:P40_observed_dimension ?dimension_c_3 .
          ?dimension_c_3 a crm:E54_Dimension ;
                         crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ;
                         rdfs:label ?v3 .
        }
        OPTIONAL { ?measC crm:P3_has_note ?d }
      }
      GROUP BY ?site
    }
  }

  # Magnitude min/max (attached to the event, aggregated per site)
  OPTIONAL {
    {
      SELECT ?site (SAMPLE(?minMag) AS ?magnitude_min) (SAMPLE(?maxMag) AS ?magnitude_max)
      WHERE {
        VALUES (?site ?event) { (?site ?event) }
        ?event crm:P39i_was_measured_by ?mag .
        ?mag a crmsci:S21_Measurement ;
             crm:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
        OPTIONAL {
          ?mag crm:P40_observed_dimension ?magDim .
          ?magDim crm:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
                  crm:P90_has_value ?minMag .
          FILTER(STRSTARTS(STR(?magDim),"https://w3id.org/sirius/magnitude_score_min/"))
        }
        OPTIONAL {
          ?mag crm:P40_observed_dimension ?magDim2 .
          ?magDim2 crm:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
                   crm:P90_has_value ?maxMag .
          FILTER(STRSTARTS(STR(?magDim2),"https://w3id.org/sirius/magnitude_score_max/"))
        }
      }
      GROUP BY ?site
    }
  }

  # Uncertainty min/max (attached to the event, aggregated per site)
  OPTIONAL {
    {
      SELECT ?site (SAMPLE(?minU) AS ?uncertainty_min) (SAMPLE(?maxU) AS ?uncertainty_max)
      WHERE {
        VALUES (?site ?event) { (?site ?event) }
        ?event crm:P39i_was_measured_by ?uncer .
        ?uncer a crmsci:S21_Measurement ;
               crm:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
        OPTIONAL {
          ?uncer crm:P40_observed_dimension ?uncDim .
          ?uncDim crm:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
                  crm:P90_has_value ?minU .
          FILTER(STRSTARTS(STR(?uncDim),"https://w3id.org/sirius/uncertainty_min/"))
        }
        OPTIONAL {
          ?uncer crm:P40_observed_dimension ?uncDim2 .
          ?uncDim2 crm:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
                   crm:P90_has_value ?maxU .
          FILTER(STRSTARTS(STR(?uncDim2),"https://w3id.org/sirius/uncertainty_max/"))
        }
      }
      GROUP BY ?site
    }
  }

}
ORDER BY ?site_label
'
  column-configuration='[
    { "displayName": "Site", "cellTemplate": "{{> siteCell}}" },
    { "displayName": "Scale A", "cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_desc}}" },
    { "displayName": "Scale B", "cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_desc}}" },
    { "displayName": "Scale C", "cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_desc}}" },
    { "displayName": "Magnitude", "cellTemplate": "{{> valueRangeCell min=magnitude_min max=magnitude_max}}" },
    { "displayName": "Uncertainty", "cellTemplate": "{{> valueRangeCell min=uncertainty_min max=uncertainty_max}}" }
  ]'
  options='{"showFilter": true, "resultsPerPage": 10, "stickyHeader": true}'>

</semantic-table>

                </div><!-- END TABLE WRAPPER -->

              </div>
            </bs-tab-pane>
          </bs-tab-content>

        </div>
      </bs-tab-container>

    </div><!-- END PAGE -->

  </template>
</with-types>
[[/inline]]

[[> resource]]
