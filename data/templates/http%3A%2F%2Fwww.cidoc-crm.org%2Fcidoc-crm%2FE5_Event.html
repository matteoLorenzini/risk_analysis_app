[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">

      <!-- ======================= HEADER ======================= -->
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">

            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>

            <mp-event-trigger id='details-view-trigger'
              type='Component.TemplateUpdate'
              data='{"iri": "{{iri}}"}'
              targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>

          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>

              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>

            </div>
          </div>
        </div>

      </div>
      <!-- ===================== END HEADER ===================== -->

      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
        <div>

          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event</bs-nav-item>
          </bs-nav>

          <bs-tab-content animation="true">
            <bs-tab-pane event-key="event-details">

              <div class="rs-resource-tab-container">

                <!-- Section header -->
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event</span>
                </div>

                <!-- ========================================================= -->
                <!--  1. KEEP EXISTING FIELD VISUALIZATION (YOUR ORIGINAL)    -->
                <!-- ========================================================= -->
                <div class="rs-resource-data-table">

                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions
                      siti="http://www.siriusplatform-risk-assessment/field/event_site_inverse"
                      magnitudo="http://www.siriusplatform-risk-assessment/field/event_site_magnitudo_inverse"
                      event_name="http://www.siriusplatform-risk-assessment/field/event_event_name"
                      agent="http://www.siriusplatform-risk-assessment/field/event_agent"
                      risk_desc="http://www.siriusplatform-risk-assessment/field/event_risk_desc"
                      a_val1="http://www.siriusplatform-risk-assessment/field/event_a_val1"
                      a_val2="http://www.siriusplatform-risk-assessment/field/event_a_val2"
                      a_val3="http://www.siriusplatform-risk-assessment/field/event_a_val3"
                      a_desc="http://www.siriusplatform-risk-assessment/field/event_a_desc"
                      b_val1="http://www.siriusplatform-risk-assessment/field/event_b_val1"
                      b_val2="http://www.siriusplatform-risk-assessment/field/event_b_val2"
                      b_val3="http://www.siriusplatform-risk-assessment/field/event_b_val3"
                      b_desc="http://www.siriusplatform-risk-assessment/field/event_b_desc"
                      c_val1="http://www.siriusplatform-risk-assessment/field/event_c_val1"
                      c_val2="http://www.siriusplatform-risk-assessment/field/event_c_val2"
                      c_val3="http://www.siriusplatform-risk-assessment/field/event_c_val3"
                      c_desc="http://www.siriusplatform-risk-assessment/field/event_c_desc"
                      magnitude_min_score="http://www.siriusplatform-risk-assessment/field/event_magnitude_min_score"
                      magnitude_max_score="http://www.siriusplatform-risk-assessment/field/event_magnitude_max_score"
                      uncertainty_min_score="http://www.siriusplatform-risk-assessment/field/event_uncertainty_min_score"
                      uncertainty_max_score="http://www.siriusplatform-risk-assessment/field/event_uncertainty_max_score"
                    ]]'
                    template='{{> template}}'>
                    <template id="template">
                      {{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}
                    </template>
                  </mp-field-visualization>

                </div>

                <!-- ========================================================= -->
                <!--  2. NEW SEMANTIC TABLE — CLEAN PER-SITE VISUALIZATION    -->
                <!-- ========================================================= -->

                <div style="margin-top:40px;">
                  <h2 class="h2" style="margin-bottom:15px;">Sites Affected (Scores Overview)</h2>

<semantic-table
  id="event-sites-table"

  query='PREFIX crm:<http://www.cidoc-crm.org/cidoc-crm/> PREFIX crmsci:<http://www.ics.forth.gr/isl/CRMsci/> PREFIX rdfs:<http://www.w3.org/2000/01/rdf-schema#> SELECT DISTINCT ?site ?site_label ?a_val1 ?a_val2 ?a_val3 ?a_desc ?b_val1 ?b_val2 ?b_val3 ?b_desc ?c_val1 ?c_val2 ?c_val3 ?c_desc ?magnitude_min ?magnitude_max ?uncertainty_min ?uncertainty_max WHERE { VALUES ?event { <[[this]]> } ?event crm:P31_has_modified ?site . OPTIONAL { ?site rdfs:label ?site_label } OPTIONAL { ?event crm:P39i_was_measured_by ?measA . ?measA crm:P2_has_type <https://w3id.org/sirius/type/scale-a-score> . OPTIONAL { ?measA crm:P40_observed_dimension ?dA1 . ?dA1 crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?a_val1 . } OPTIONAL { ?measA crm:P40_observed_dimension ?dA2 . ?dA2 crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?a_val2 . } OPTIONAL { ?measA crm:P40_observed_dimension ?dA3 . ?dA3 crm:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?a_val3 . } OPTIONAL { ?measA crm:P3_has_note ?a_desc } } OPTIONAL { ?event crm:P39i_was_measured_by ?measB . ?measB crm:P2_has_type <https://w3id.org/sirius/type/scale-b-score> . OPTIONAL { ?measB crm:P40_observed_dimension ?dB1 . ?dB1 crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?b_val1 . } OPTIONAL { ?measB crm:P40_observed_dimension ?dB2 . ?dB2 crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?b_val2 . } OPTIONAL { ?measB crm:P40_observed_dimension ?dB3 . ?dB3 crm:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?b_val3 . } OPTIONAL { ?measB crm:P3_has_note ?b_desc } } OPTIONAL { ?event crm:P39i_was_measured_by ?measC . ?measC crm:P2_has_type <https://w3id.org/sirius/type/scale-c-score> . OPTIONAL { ?measC crm:P40_observed_dimension ?dC1 . ?dC1 crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?c_val1 . } OPTIONAL { ?measC crm:P40_observed_dimension ?dC2 . ?dC2 crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?c_val2 . } OPTIONAL { ?measC crm:P40_observed_dimension ?dC3 . ?dC3 crm:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?c_val3 . } OPTIONAL { ?measC crm:P3_has_note ?c_desc } } OPTIONAL { ?event crm:P39i_was_measured_by ?mag . ?mag crm:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ; crm:P40_observed_dimension ?magDim . OPTIONAL { ?magDim crm:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; crm:P90_has_value ?magnitude_min . FILTER(STRSTARTS(STR(?magDim), "https://w3id.org/sirius/magnitude_score_min")) } OPTIONAL { ?magDim crm:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; crm:P90_has_value ?magnitude_max . FILTER(STRSTARTS(STR(?magDim), "https://w3id.org/sirius/magnitude_score_max")) } } OPTIONAL { ?event crm:P39i_was_measured_by ?unc . ?unc crm:P2_has_type <https://w3id.org/sirius/type/uncertainty> ; crm:P40_observed_dimension ?uncDim . OPTIONAL { ?uncDim crm:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?uncertainty_min . FILTER(STRSTARTS(STR(?uncDim), "https://w3id.org/sirius/uncertainty_min")) } OPTIONAL { ?uncDim crm:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?uncertainty_max . FILTER(STRSTARTS(STR(?uncDim), "https://w3id.org/sirius/uncertainty_max")) } } } ORDER BY ?site_label'

  column-configuration='[
    { "displayName": "Site",         "cellTemplate": "{{> siteCell}}" },
    { "displayName": "Scale A",      "cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_desc}}" },
    { "displayName": "Scale B",      "cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_desc}}" },
    { "displayName": "Scale C",      "cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_desc}}" },
    { "displayName": "Magnitude",    "cellTemplate": "{{> valueRangeCell min=magnitude_min max=magnitude_max}}" },
    { "displayName": "Uncertainty",  "cellTemplate": "{{> valueRangeCell min=uncertainty_min max=uncertainty_max}}" }
  ]'

  options='{"showFilter": false, "resultsPerPage": 50, "stickyHeader": true}'>


  <!-- ==================== CELL TEMPLATES ==================== -->

  <template id="siteCell">
    {{#if site_label.value}}
      <semantic-link iri="{{site.value}}">
        <span class="pill">{{site_label.value}}</span>
      </semantic-link>
    {{else}}
      <span class="pill">{{site.value}}</span>
    {{/if}}
  </template>

  <template id="scaleTripleCell">
    {{#if v1.value}}<div><b>{{v1.value}}</b></div>{{/if}}
    {{#if v2.value}}<div><b>{{v2.value}}</b></div>{{/if}}
    {{#if v3.value}}<div><b>{{v3.value}}</b></div>{{/if}}
    {{#unless v1.value}}{{#unless v2.value}}{{#unless v3.value}}<div>—</div>{{/unless}}{{/unless}}{{/unless}}
    {{#if desc.value}}<div class="note">{{desc.value}}</div>{{/if}}
  </template>

  <template id="valueRangeCell">
    {{#if min.value}}<div>{{min.value}}</div>{{/if}}
    {{#if max.value}}<div>{{max.value}}</div>{{/if}}
    {{#unless min.value}}{{#unless max.value}}<div>—</div>{{/unless}}{{/unless}}
  </template>

</semantic-table>

<style>
  #event-sites-table .pill {
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #ccc;
    background:#f9f9f9;
  }
  #event-sites-table .note {
    font-size:0.85em;
    opacity:0.75;
  }
</style>

                </div>
                <!-- END NEW TABLE -->

              </div>
            </bs-tab-pane>

          </bs-tab-content>

        </div>
      </bs-tab-container>

    </div>
  </template>

</with-types>
[[/inline]]
[[> resource]]
