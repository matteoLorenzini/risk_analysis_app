[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">

      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">

            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>

            <mp-event-trigger id='details-view-trigger'
              type='Component.TemplateUpdate'
              data='{"iri": "{{iri}}"}'
              targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>

          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>

              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>

            </div>
          </div>
        </div>

      </div>
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="sites-modified">
        <div>

          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="sites-modified">Sites Affected</bs-nav-item>
          </bs-nav>

          <bs-tab-content animation="true">
            <bs-tab-pane event-key="sites-modified">

              <div class="rs-resource-tab-container">

                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Sites Modified and Associated Scores</span>
                </div>
                
                <div style="margin-top:40px;">
                  <h2 class="h2" style="margin-bottom:15px;">Sites Affected by this Event</h2>

<semantic-table
  id="event-sites-table"

  query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?subject
  ?site_label
  ?event
  ?event_name
  ?agent
  ?a_val1 ?a_val2 ?a_val3 ?a_desc_site
  ?b_val1 ?b_val2 ?b_val3 ?b_desc_site
  ?c_val1 ?c_val2 ?c_val3 ?c_desc_site
  ?risk_desc
  ?magnitude_min_score_site ?magnitude_max_score_site
  ?uncertainty_min_score_site ?uncertainty_max_score_site
WHERE {
  # 1. EVENT BINDING: Start with the Event URI you are interested in.
  VALUES ?event { <[[this]]> } # <-- INSERT YOUR EVENT URI HERE (e.g., the Earthquake)
  ?event a base:E5_Event .

  # 2. MAIN PATTERN: Find all E18 Sites modified by this Event.
  ?event base:P31_has_modified ?subject .
  ?subject a base:E18_Physical_Thing .
  OPTIONAL { ?subject rdfs:label ?site_label }

  # Event name (will be the same for all rows, but good for context)
  OPTIONAL { ?event rdfs:label ?event_name . }

  # Risk Analysis description tied to this event and subject (site)
  OPTIONAL {
    ?ra a base:E89_Propositional_Object ;
      base:P129_is_about ?subject ;
      base:P129_is_about ?event .
    OPTIONAL { ?ra base:P3_has_note ?risk_desc }
  }
  
  # Actor
  OPTIONAL {
    ?event base:P11_had_participant ?actor .
    ?actor a base:E39_Actor ;
      rdfs:label ?agent .
  }

  # --- Aggregated Measurement Subqueries (Logic preserved for data cleanup) ---

  # 3. Scale A (Aggregated per event+subject in subquery)
  OPTIONAL {
    { SELECT ?event ?subject (SAMPLE(?v1) AS ?a_val1) (SAMPLE(?v2) AS ?a_val2) (SAMPLE(?v3) AS ?a_val3) (SAMPLE(?dA) AS ?a_desc_site)
      WHERE {
        ?event base:P31_has_modified ?subject .
        ?event base:P39i_was_measured_by ?measA .
        ?measA a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
        OPTIONAL { ?measA base:P129_is_about ?subject . }            # prefer measurements that reference the subject
        OPTIONAL { ?measA base:P40_observed_dimension ?dimension_a_1 . ?dimension_a_1 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measA base:P40_observed_dimension ?dimension_a_2 . ?dimension_a_2 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measA base:P40_observed_dimension ?dimension_a_3 . ?dimension_a_3 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measA base:P3_has_note ?dA }
      }
      GROUP BY ?event ?subject
    }
  }

  # 4. Scale B (per event+subject)
  OPTIONAL {
    { SELECT ?event ?subject (SAMPLE(?v1) AS ?b_val1) (SAMPLE(?v2) AS ?b_val2) (SAMPLE(?v3) AS ?b_val3) (SAMPLE(?dB) AS ?b_desc_site)
      WHERE {
        ?event base:P31_has_modified ?subject .
        ?event base:P39i_was_measured_by ?measB .
        ?measB a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
        OPTIONAL { ?measB base:P129_is_about ?subject . }
        OPTIONAL { ?measB base:P40_observed_dimension ?dimension_b_1 . ?dimension_b_1 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measB base:P40_observed_dimension ?dimension_b_2 . ?dimension_b_2 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measB base:P40_observed_dimension ?dimension_b_3 . ?dimension_b_3 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measB base:P3_has_note ?dB }
      }
      GROUP BY ?event ?subject
    }
  }

  # 5. Scale C (per event+subject)
  OPTIONAL {
    { SELECT ?event ?subject (SAMPLE(?v1) AS ?c_val1) (SAMPLE(?v2) AS ?c_val2) (SAMPLE(?v3) AS ?c_val3) (SAMPLE(?dC) AS ?c_desc_site)
      WHERE {
        ?event base:P31_has_modified ?subject .
        ?event base:P39i_was_measured_by ?measC .
        ?measC a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
        OPTIONAL { ?measC base:P129_is_about ?subject . }
        OPTIONAL { ?measC base:P40_observed_dimension ?dimension_c_1 . ?dimension_c_1 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?v1 . }
        OPTIONAL { ?measC base:P40_observed_dimension ?dimension_c_2 . ?dimension_c_2 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?v2 . }
        OPTIONAL { ?measC base:P40_observed_dimension ?dimension_c_3 . ?dimension_c_3 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?v3 . }
        OPTIONAL { ?measC base:P3_has_note ?dC }
      }
      GROUP by ?event ?subject
    }
  }

  # 6. Magnitude score (per event+subject)
  OPTIONAL {
    { SELECT ?event ?subject (SAMPLE(?minM) AS ?magnitude_min_score_site) (SAMPLE(?maxM) AS ?magnitude_max_score_site)
      WHERE {
        ?event base:P31_has_modified ?subject .
        ?event base:P39i_was_measured_by ?magnitude .
        ?magnitude a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
        OPTIONAL { ?magnitude base:P129_is_about ?subject . }
        OPTIONAL {
          ?magnitude base:P40_observed_dimension ?magnitude_dim_min .
          ?magnitude_dim_min a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?minM .
          FILTER(STRSTARTS(STR(?magnitude_dim_min), "https://w3id.org/sirius/magnitude_score_min/"))
        }
        OPTIONAL {
          ?magnitude base:P40_observed_dimension ?magnitude_dim_max .
          ?magnitude_dim_max a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?maxM .
          FILTER(STRSTARTS(STR(?magnitude_dim_max), "https://w3id.org/sirius/magnitude_score_max/"))
        }
      }
      GROUP BY ?event ?subject
    }
  }

  # 7. Uncertainty score (per event+subject)
  OPTIONAL {
    { SELECT ?event ?subject (SAMPLE(?minU) AS ?uncertainty_min_score_site) (SAMPLE(?maxU) AS ?uncertainty_max_score_site)
      WHERE {
        ?event base:P31_has_modified ?subject .
        ?event base:P39i_was_measured_by ?uncertainty .
        ?uncertainty a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
        OPTIONAL { ?uncertainty base:P129_is_about ?subject . }
        OPTIONAL {
          ?uncertainty base:P40_observed_dimension ?uncertainty_dim_min .
          ?uncertainty_dim_min a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?minU .
          FILTER(STRSTARTS(STR(?uncertainty_dim_min), "https://w3id.org/sirius/uncertainty_min/"))
        }
        OPTIONAL {
          ?uncertainty base:P40_observed_dimension ?uncertainty_dim_max .
          ?uncertainty_dim_max a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?maxU .
          FILTER(STRSTARTS(STR(?uncertainty_dim_max), "https://w3id.org/sirius/uncertainty_max/"))
        }
      }
      GROUP BY ?event ?subject
    }
  }
}
ORDER BY ?site_label
'
  column-configuration='[
    { "displayName": "Site","cellTemplate": "{{> siteLinkCell}}" },
    { "displayName": "Scale A","cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_desc_site}}" },
    { "displayName": "Scale B","cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_desc_site}}" },
    { "displayName": "Scale C","cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_desc_site}}" },
    { "displayName": "Magnitude","cellTemplate": "{{> valueRangeCell min=magnitude_min_score_site max=magnitude_max_score_site}}" },
    { "displayName": "Uncertainty","cellTemplate": "{{> valueRangeCell min=uncertainty_min_score_site max=uncertainty_max_score_site}}" }
  ]'
  options='{"showFilter": true, "resultsPerPage": 50, "stickyHeader": true}'>


  <template id="siteLinkCell">
    {{#if site.value}}
      <semantic-link iri="{{site.value}}">
        <span class="pill">{{site_label.value}}</span>
      </semantic-link>
    {{else}}
      <span class="pill">Unknown Site</span>
    {{/if}}
  </template>

  <template id="scaleTripleCell">
    {{#if v1.value}}
      <div class="val"><strong><span class="dim-label">V1</span> {{v1.value}}</strong></div>
    {{/if}}
    {{#if v2.value}}
      <div class="val"><strong><span class="dim-label">V2</span> {{v2.value}}</strong></div>
    {{/if}}
    {{#if v3.value}}
      <div class="val"><strong><span class="dim-label">V3</span> {{v3.value}}</strong></div>
    {{/if}}
    {{#unless v1.value}}{{#unless v2.value}}{{#unless v3.value}}<div class="empty">—</div>{{/unless}}{{/unless}}{{/unless}}
    
    {{#if desc.value}}
      <div class="note"><span class="dim-label">Note</span> {{desc.value}}</div>
    {{/if}}
  </template>

  <template id="valueRangeCell">
    {{#if min.value}}
      <div class="val"><span class="dim-label">Min</span> {{min.value}}</div>
      {{#if max.value}}<div class="val"><span class="dim-label">Max</span> {{max.value}}</div>{{/if}}
    {{else}}
      {{#if max.value}}
        <div class="val"><span class="dim-label">Max</span> {{max.value}}</div>
      {{else}}
        <div class="empty">—</div>
      {{/if}}
    {{/if}}
  </template>

</semantic-table>

<style>
  #event-sites-table .pill {
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #ccc;
    background:#f9f9f9;
  }
  #event-sites-table .note {
    font-size:0.85em;
    opacity:0.75;
  }
  #event-sites-table .val  { line-height: 1.25; }
  #event-sites-table .empty{ text-align:center; opacity:.5; }
  #event-sites-table .dim-label { font-size:.825em; text-transform:uppercase; letter-spacing:.02em; opacity:.7; margin-right:.35rem; }
</style>

                </div>
                </div>
            </bs-tab-pane>

          </bs-tab-content>

        </div>
      </bs-tab-container>

    </div>
  </template>

</with-types>
[[/inline]]
[[> resource]]
