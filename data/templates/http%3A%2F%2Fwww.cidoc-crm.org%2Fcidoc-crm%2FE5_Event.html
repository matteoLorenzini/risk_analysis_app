[[#*inline "resource"]]

  <with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
    <template id='page'>
      <div class="rs-resource-container">
        <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
          <div class="rs-resource-header-topContainer">
            <div class="rs-resource-header-topButtons">
              <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
                <button type="button" title="Author Resource in Knowledge Map">
                  <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
                </button>
              </semantic-link-container>
              <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
                <button type="button" title="Resource Details">
                  <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
                </button>
              </mp-event-trigger>
            </div>
          </div>

          <div class="rs-resource-header-content-container">
            <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
              <div class="rs-resource-header--singletitle">
                <div class="rs-resource-header--title" style="text-transform: capitalize;">
                  <mp-label iri='[[this]]'></mp-label>
                </div>
                <div style="display: flex; gap: 12px; align-items:center;">
                  <mp-copy-to-clipboard text='[[this]]'>
                    <div class="rs-copy-IRI">Copy IRI</div>
                  </mp-copy-to-clipboard>
                  <div class="statements">Statements</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
          <div>
            <bs-nav bs-style="tabs">
              <bs-nav-item event-key="event-details">Event</bs-nav-item>
            </bs-nav>
            <bs-tab-content animation="true">
              <bs-tab-pane event-key="event-details">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Event</span>
                  </div>

                  <div class="rs-resource-data-table">

                    <!-- ============================= -->
                    <!--      SEMANTIC TABLE + UI     -->
                    <!-- ============================= -->

                    <semantic-table
                      id="site-events-table"
                      query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?event ?event_name
  ?site ?siteLabel
  ?uncertainty_score ?magnitude_value
  ?a_val1 ?a_val2 ?a_val3 ?a_note
  ?b_val1 ?b_val2 ?b_val3 ?b_note
  ?c_val1 ?c_val2 ?c_val3 ?c_note
WHERE {

  #################################################################
  # 1) CURRENT EVENT + ITS TYPE (E55_Type)
  #################################################################
  BIND(<[[this]]> AS ?currentEvent)

  ?currentEvent a base:E5_Event ;
                base:P2_has_type ?eventType .

  #################################################################
  # 2) RETRIEVE ALL EVENTS OF SAME TYPE
  #################################################################
  ?event a base:E5_Event ;
         base:P2_has_type ?eventType ;
         rdfs:label ?event_name .

  #################################################################
  # 3) SITE IMPACTED BY THE EVENT
  #################################################################
  OPTIONAL {
    ?event base:P31_has_modified ?site .
    OPTIONAL { ?site rdfs:label ?siteLabel }
  }

  #################################################################
  # 4) UNCERTAINTY SCORE
  #################################################################
  OPTIONAL {
    SELECT ?event (SAMPLE(?uVal) AS ?uncertainty_score)
    WHERE {
      ?event base:P39i_was_measured_by ?u .
      ?u a crmsci:S21_Measurement ;
         base:P2_has_type <https://w3id.org/sirius/type/uncertainty> ;
         base:P40_observed_dimension ?uDim .
      ?uDim base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
            rdfs:label ?uVal .
    }
    GROUP BY ?event
  }

  #################################################################
  # 5) MAGNITUDE SCORE
  #################################################################
  OPTIONAL {
    SELECT ?event (SAMPLE(?mVal) AS ?magnitude_value)
    WHERE {
      ?event base:P39i_was_measured_by ?mag .
      ?mag a crmsci:S21_Measurement ;
           base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
           base:P40_observed_dimension ?mDim .
      ?mDim base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
            base:P90_has_value ?mVal .
    }
    GROUP BY ?event
  }

  #################################################################
  # 6) SCALE A
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1) AS ?a_val1)
           (SAMPLE(?v2) AS ?a_val2)
           (SAMPLE(?v3) AS ?a_val3)
           (SAMPLE(?note) AS ?a_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mA .
      ?mA base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .

      OPTIONAL { ?mA base:P40_observed_dimension ?d1 .
                 ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ;
                      rdfs:label ?v1 . }

      OPTIONAL { ?mA base:P40_observed_dimension ?d2 .
                 ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ;
                      rdfs:label ?v2 . }

      OPTIONAL { ?mA base:P40_observed_dimension ?d3 .
                 ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ;
                      rdfs:label ?v3 . }

      OPTIONAL { ?mA base:P3_has_note ?note }
    }
    GROUP BY ?event
  }

  #################################################################
  # 7) SCALE B
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1b) AS ?b_val1)
           (SAMPLE(?v2b) AS ?b_val2)
           (SAMPLE(?v3b) AS ?b_val3)
           (SAMPLE(?noteB) AS ?b_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mB .
      ?mB base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .

      OPTIONAL { ?mB base:P40_observed_dimension ?db1 .
                 ?db1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ;
                      rdfs:label ?v1b . }

      OPTIONAL { ?mB base:P40_observed_dimension ?db2 .
                 ?db2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ;
                      rdfs:label ?v2b . }

      OPTIONAL { ?mB base:P40_observed_dimension ?db3 .
                 ?db3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ;
                      rdfs:label ?v3b . }

      OPTIONAL { ?mB base:P3_has_note ?noteB }
    }
    GROUP BY ?event
  }

  #################################################################
  # 8) SCALE C
  #################################################################
  OPTIONAL {
    SELECT ?event
           (SAMPLE(?v1c) AS ?c_val1)
           (SAMPLE(?v2c) AS ?c_val2)
           (SAMPLE(?v3c) AS ?c_val3)
           (SAMPLE(?noteC) AS ?c_note)
    WHERE {
      ?event base:P39i_was_measured_by ?mC .
      ?mC base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .

      OPTIONAL { ?mC base:P40_observed_dimension ?dc1 .
                 ?dc1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ;
                      rdfs:label ?v1c . }

      OPTIONAL { ?mC base:P40_observed_dimension ?dc2 .
                 ?dc2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ;
                      rdfs:label ?v2c . }

      OPTIONAL { ?mC base:P40_observed_dimension ?dc3 .
                 ?dc3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ;
                      rdfs:label ?v3c . }

      OPTIONAL { ?mC base:P3_has_note ?noteC }
    }
    GROUP BY ?event
  }
}
ORDER BY ?event ?siteLabel
                      '
                      column-configuration='[
                        { "displayName": "Event",        "cellTemplate": "{{> eventCell}}" },
                        { "displayName": "Site",         "cellTemplate": "{{> siteCell}}" },
                        { "displayName": "Uncertainty",  "cellTemplate": "{{> uncCell}}" },
                        { "displayName": "Magnitude",    "cellTemplate": "{{> magCell}}" },
                        { "displayName": "Scale A",      "cellTemplate": "{{> scaleCell a_val1 a_val2 a_val3 a_note}}" },
                        { "displayName": "Scale B",      "cellTemplate": "{{> scaleCell b_val1 b_val2 b_val3 b_note}}" },
                        { "displayName": "Scale C",      "cellTemplate": "{{> scaleCell c_val1 c_val2 c_val3 c_note}}" }
                      ]'
                      options='{"showFilter": true, "resultsPerPage": 20, "stickyHeader": true}'>

                      <!-- EVENT CELL -->
                      <template id="eventCell">
                        {{#if event_name.value}}
                          <span class="pill">{{event_name.value}}</span>
                        {{else}}
                          <span class="empty">—</span>
                        {{/if}}
                      </template>

                      <!-- SITE CELL -->
                      <template id="siteCell">
                        {{#if siteLabel.value}}
                          <span class="pill">{{siteLabel.value}}</span>
                        {{else}}
                          {{#if site.value}}
                            <span class="mono">{{site.value}}</span>
                          {{else}}
                            <span class="empty">—</span>
                          {{/if}}
                        {{/if}}
                      </template>

                      <!-- UNCERTAINTY CELL -->
                      <template id="uncCell">
                        {{#if uncertainty_score.value}}
                          <span class="badge-soft">{{uncertainty_score.value}}</span>
                        {{else}}
                          <span class="empty">—</span>
                        {{/if}}
                      </template>

                      <!-- MAGNITUDE CELL -->
                      <template id="magCell">
                        {{#if magnitude_value.value}}
                          <span class="badge-soft">{{magnitude_value.value}}</span>
                        {{else}}
                          <span class="empty">—</span>
                        {{/if}}
                      </template>

                      <!-- GENERIC SCALE CELL: 3 values + note -->
                      <template id="scaleCell">
                        <div class="scale-block">
                          {{#if 0.value}}{{/if}}
                          {{#if 1.value}}{{/if}}
                        </div>
                      </template>

                      <!-- We can’t use positional args directly, so define 3 specific templates instead -->
                      <!-- SCALE A -->
                      <template id="scaleCell">
                        <div class="scale-block">
                          {{#if a_val1.value}}
                            <div><span class="label-small">Val.1</span> {{a_val1.value}}</div>
                          {{/if}}
                          {{#if a_val2.value}}
                            <div><span class="label-small">Val.2</span> {{a_val2.value}}</div>
                          {{/if}}
                          {{#if a_val3.value}}
                            <div><span class="label-small">Val.3</span> {{a_val3.value}}</div>
                          {{/if}}

                          {{#unless a_val1.value}}
                            {{#unless a_val2.value}}
                              {{#unless a_val3.value}}
                                <span class="empty">—</span>
                              {{/unless}}
                            {{/unless}}
                          {{/unless}}

                          {{#if a_note.value}}
                            <div class="note">{{a_note.value}}</div>
                          {{/if}}
                        </div>
                      </template>

                      <!-- SCALE B -->
                      <template id="scaleCellB">
                        <div class="scale-block">
                          {{#if b_val1.value}}
                            <div><span class="label-small">Val.1</span> {{b_val1.value}}</div>
                          {{/if}}
                          {{#if b_val2.value}}
                            <div><span class="label-small">Val.2</span> {{b_val2.value}}</div>
                          {{/if}}
                          {{#if b_val3.value}}
                            <div><span class="label-small">Val.3</span> {{b_val3.value}}</div>
                          {{/if}}

                          {{#unless b_val1.value}}
                            {{#unless b_val2.value}}
                              {{#unless b_val3.value}}
                                <span class="empty">—</span>
                              {{/unless}}
                            {{/unless}}
                          {{/unless}}

                          {{#if b_note.value}}
                            <div class="note">{{b_note.value}}</div>
                          {{/if}}
                        </div>
                      </template>

                      <!-- SCALE C -->
                      <template id="scaleCellC">
                        <div class="scale-block">
                          {{#if c_val1.value}}
                            <div><span class="label-small">Val.1</span> {{c_val1.value}}</div>
                          {{/if}}
                          {{#if c_val2.value}}
                            <div><span class="label-small">Val.2</span> {{c_val2.value}}</div>
                          {{/if}}
                          {{#if c_val3.value}}
                            <div><span class="label-small">Val.3</span> {{c_val3.value}}</div>
                          {{/if}}

                          {{#unless c_val1.value}}
                            {{#unless c_val2.value}}
                              {{#unless c_val3.value}}
                                <span class="empty">—</span>
                              {{/unless}}
                            {{/unless}}
                          {{/unless}}

                          {{#if c_note.value}}
                            <div class="note">{{c_note.value}}</div>
                          {{/if}}
                        </div>
                      </template>

                      <!-- override column config to use specific scale templates -->
                      <script type="application/json" data-semantic-table-config-for="site-events-table">
                        {
                          "columnConfiguration": [
                            { "displayName": "Event",        "cellTemplate": "{{> eventCell}}" },
                            { "displayName": "Site",         "cellTemplate": "{{> siteCell}}" },
                            { "displayName": "Uncertainty",  "cellTemplate": "{{> uncCell}}" },
                            { "displayName": "Magnitude",    "cellTemplate": "{{> magCell}}" },
                            { "displayName": "Scale A",      "cellTemplate": "{{> scaleCell}}" },
                            { "displayName": "Scale B",      "cellTemplate": "{{> scaleCellB}}" },
                            { "displayName": "Scale C",      "cellTemplate": "{{> scaleCellC}}" }
                          ]
                        }
                      </script>

                      <!-- TABLE STYLES -->
                      <style>
                        #site-events-table .mono {
                          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                          font-size: .9em;
                          word-break: break-all;
                        }
                        #site-events-table .pill {
                          display:inline-block;
                          padding:.2rem .55rem;
                          border-radius:999px;
                          background:#f3f4f6;
                          border:1px solid #e5e7eb;
                        }
                        #site-events-table .badge-soft {
                          display:inline-block;
                          padding:.15rem .45rem;
                          border-radius:.35rem;
                          background:#eef2ff;
                          border:1px solid #e5e7eb;
                          font-size:.9em;
                        }
                        #site-events-table .empty {
                          opacity:.6;
                          font-style:italic;
                        }
                        #site-events-table .note {
                          margin-top:.15rem;
                          font-size:.9em;
                          opacity:.85;
                          white-space:pre-wrap;
                        }
                        #site-events-table .scale-block > div {
                          line-height:1.25;
                        }
                        #site-events-table .label-small {
                          font-size:.8em;
                          text-transform:uppercase;
                          letter-spacing:.04em;
                          opacity:.7;
                          margin-right:.3rem;
                        }
                      </style>

                    </semantic-table>

                  </div>
                </div>
              </bs-tab-pane>
            </bs-tab-content>
          </div>
        </bs-tab-container>
      </div>
    </template>
  </with-types>

[[/inline]]
[[> resource]]
