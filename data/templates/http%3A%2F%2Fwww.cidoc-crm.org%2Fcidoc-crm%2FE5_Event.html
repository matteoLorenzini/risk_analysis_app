[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="sites-modified">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="sites-modified">Sites Affected</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="sites-modified">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Sites Modified and Associated Risk</span>
                </div>
                
                <div style="margin-top:40px;">
                  <h2 class="h2" style="margin-bottom:15px;">Sites Affected by this Event</h2>

<semantic-table
  id="event-sites-table"

  query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?subject
  ?site_label
  ?risk_desc
  ?a_val1 
  ?magnitude_min ?uncertainty_min # Select only the core event-global scores
WHERE {
  # 1. EVENT BINDING: Use [[this]] (the current page URI)
  VALUES ?event { <[[this]]> } 
  ?event a base:E5_Event .

  # 2. MAIN PATTERN: Find all E18 Sites modified by this Event.
  ?event base:P31_has_modified ?subject .
  ?subject a base:E18_Physical_Thing .
  OPTIONAL { ?subject rdfs:label ?site_label }

  # **Site-Specific Risk Analysis (Varying Data)**
  OPTIONAL {
    ?ra a base:E89_Propositional_Object ;
      base:P129_is_about ?subject ;
      base:P129_is_about ?event .
    OPTIONAL { ?ra base:P3_has_note ?risk_desc }
  }
  
  # --- Aggregated Measurement Subqueries (Grouped only by ?event) ---

  # 3. Scale A (Only need V1 as an example global score)
  OPTIONAL {
    { SELECT ?event (SAMPLE(?v1) AS ?a_val1)
      WHERE {
        ?event base:P39i_was_measured_by ?measA .
        ?measA a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
        OPTIONAL { ?measA base:P40_observed_dimension ?dimension_a_1 . ?dimension_a_1 a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?v1 . }
      }
      GROUP BY ?event
    }
  }

  # 4. Magnitude score
  OPTIONAL {
    { SELECT ?event (SAMPLE(?minM) AS ?magnitude_min)
      WHERE {
        ?event base:P39i_was_measured_by ?magnitude .
        ?magnitude a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
        OPTIONAL {
          ?magnitude base:P40_observed_dimension ?magnitude_dim_min .
          ?magnitude_dim_min a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?minM .
          FILTER(STRSTARTS(STR(?magnitude_dim_min), "https://w3id.org/sirius/magnitude_score_min/"))
        }
      }
      GROUP BY ?event
    }
  }

  # 5. Uncertainty score
  OPTIONAL {
    { SELECT ?event (SAMPLE(?minU) AS ?uncertainty_min)
      WHERE {
        ?event base:P39i_was_measured_by ?uncertainty .
        ?uncertainty a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
        OPTIONAL {
          ?uncertainty base:P40_observed_dimension ?uncertainty_dim_min .
          ?uncertainty_dim_min a base:E54_Dimension ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?minU .
          FILTER(STRSTARTS(STR(?uncertainty_dim_min), "https://w3id.org/sirius/uncertainty_min/"))
        }
      }
      GROUP BY ?event
    }
  }
}
ORDER BY ?site_label
'
  column-configuration='[
    { "displayName": "Affected Site (E18)",   "cellTemplate": "{{> siteLinkCell}}" },
    { "displayName": "Risk Description (E89)",  "cellTemplate": "{{> riskDescCell}}" },
    { "displayName": "Global Score (A-V1)",     "cellTemplate": "{{a_val1.value}}"},
    { "displayName": "Global Magnitude (Min)",  "cellTemplate": "{{magnitude_min.value}}"},
    { "displayName": "Global Uncertainty (Min)",  "cellTemplate": "{{uncertainty_min.value}}"}
  ]'
  options='{"showFilter": true, "resultsPerPage": 50, "stickyHeader": true}'>

  <template id="siteLinkCell">
    {{#if subject.value}}
      <semantic-link iri="{{subject.value}}">
        <span class="pill">{{site_label.value}}</span>
      </semantic-link>
    {{else}}
      <span class="pill">Unknown Site</span>
    {{/if}}
  </template>
  
  <template id="riskDescCell">
    {{#if risk_desc.value}}
      <span class="risk-note">{{risk_desc.value}}</span>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>
  </semantic-table>

<style>
  #event-sites-table .pill {
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #ccc;
    background:#f9f9f9;
  }
  #event-sites-table .risk-note {
    font-size:0.95em;
    font-style: italic;
    color: #333;
  }
  #event-sites-table .empty{ text-align:center; opacity:.5; }
</style>

                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>

    </div>
  </template>

</with-types>
[[/inline]]
[[> resource]]
