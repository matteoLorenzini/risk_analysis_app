[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">
            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>
            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>
          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <!-- map removed for Event resource; keep title / actions -->
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>
              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="event-details">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event</span>
                </div>
                <div class="rs-resource-data-table">

                  <table class="event-field-grid" style="width:100%; border-collapse:collapse; margin-top:8px;">
                    <tr>
                      <th style="text-align:left; padding:8px; border-bottom:1px solid #e5e7eb; width:240px;">Field</th>
                      <td style="padding:8px; border-bottom:1px solid #e5e7eb;">
                        <!-- Event name (single-value query) -->
                  <semantic-table id="event-risk-table" query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?site (SAMPLE(?siteLabel_) AS ?siteLabel) (SAMPLE(?agent_) AS ?agent)
       (SAMPLE(?eventName_) AS ?event_name)
       (SAMPLE(?a1) AS ?a_val1) (SAMPLE(?a2) AS ?a_val2) (SAMPLE(?a3) AS ?a_val3) (SAMPLE(?aNote) AS ?a_note)
       (SAMPLE(?b1) AS ?b_val1) (SAMPLE(?b2) AS ?b_val2) (SAMPLE(?b3) AS ?b_val3) (SAMPLE(?bNote) AS ?b_note)
       (SAMPLE(?c1) AS ?c_val1) (SAMPLE(?c2) AS ?c_val2) (SAMPLE(?c3) AS ?c_val3) (SAMPLE(?cNote) AS ?c_note)
       (SAMPLE(?magMin) AS ?mag_min) (SAMPLE(?magMax) AS ?mag_max)
       (SAMPLE(?uncMin) AS ?unc_min) (SAMPLE(?uncMax) AS ?unc_max)
       (SAMPLE(?riskNote) AS ?risk_desc)
WHERE {
  BIND(<[[this]]> AS ?event)
  ?event a base:E5_Event ;
         base:P31_has_modified ?site .

  OPTIONAL { ?site rdfs:label ?siteLabel_ }
  OPTIONAL { ?event rdfs:label ?eventName_ }
  OPTIONAL {
    ?event base:P11_had_participant ?act .
    ?act rdfs:label ?agent_ .
  }

  # Risk description
  OPTIONAL {
    ?ra a base:E89_Propositional_Object ;
        base:P129_is_about ?event ;
        base:P129_is_about ?site ;
        base:P3_has_note ?riskNote .
  }

  ############################
  # SCALE A (NO P129 filter)
  ############################
  OPTIONAL {
    ?event base:P39i_was_measured_by ?mA .
    ?mA base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
    OPTIONAL {
      ?mA base:P40_observed_dimension ?dA1 .
      ?dA1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ;
           rdfs:label ?a1 .
    }
    OPTIONAL {
      ?mA base:P40_observed_dimension ?dA2 .
      ?dA2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ;
           rdfs:label ?a2 .
    }
    OPTIONAL {
      ?mA base:P40_observed_dimension ?dA3 .
      ?dA3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ;
           rdfs:label ?a3 .
    }
    OPTIONAL { ?mA base:P3_has_note ?aNote }
  }

  ############################
  # SCALE B
  ############################
  OPTIONAL {
    ?event base:P39i_was_measured_by ?mB .
    ?mB base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
    OPTIONAL {
      ?mB base:P40_observed_dimension ?dB1 .
      ?dB1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ;
           rdfs:label ?b1 .
    }
    OPTIONAL {
      ?mB base:P40_observed_dimension ?dB2 .
      ?dB2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ;
           rdfs:label ?b2 .
    }
    OPTIONAL {
      ?mB base:P40_observed_dimension ?dB3 .
      ?dB3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ;
           rdfs:label ?b3 .
    }
    OPTIONAL { ?mB base:P3_has_note ?bNote }
  }

  ############################
  # SCALE C
  ############################
  OPTIONAL {
    ?event base:P39i_was_measured_by ?mC .
    ?mC base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
    OPTIONAL {
      ?mC base:P40_observed_dimension ?dC1 .
      ?dC1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ;
           rdfs:label ?c1 .
    }
    OPTIONAL {
      ?mC base:P40_observed_dimension ?dC2 .
      ?dC2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ;
           rdfs:label ?c2 .
    }
    OPTIONAL {
      ?mC base:P40_observed_dimension ?dC3 .
      ?dC3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ;
           rdfs:label ?c3 .
    }
    OPTIONAL { ?mC base:P3_has_note ?cNote }
  }

  ############################
  # MAGNITUDE
  ############################
  OPTIONAL {
    ?event base:P39i_was_measured_by ?mag .
    ?mag base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
    OPTIONAL {
      ?mag base:P40_observed_dimension ?md1 .
      ?md1 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
           base:P90_has_value ?magMin .
      FILTER(STRSTARTS(STR(?md1), "https://w3id.org/sirius/magnitude_score_min/"))
    }
    OPTIONAL {
      ?mag base:P40_observed_dimension ?md2 .
      ?md2 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ;
           base:P90_has_value ?magMax .
      FILTER(STRSTARTS(STR(?md2), "https://w3id.org/sirius/magnitude_score_max/"))
    }
  }

  ############################
  # UNCERTAINTY
  ############################
  OPTIONAL {
    ?event base:P39i_was_measured_by ?unc .
    ?unc base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
    OPTIONAL {
      ?unc base:P40_observed_dimension ?ud1 .
      ?ud1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
           rdfs:label ?uncMin .
      FILTER(STRSTARTS(STR(?ud1), "https://w3id.org/sirius/uncertainty_min/"))
    }
    OPTIONAL {
      ?unc base:P40_observed_dimension ?ud2 .
      ?ud2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ;
           rdfs:label ?uncMax .
      FILTER(STRSTARTS(STR(?ud2), "https://w3id.org/sirius/uncertainty_max/"))
    }
  }
}
GROUP BY ?site
ORDER BY ?siteLabel

' column-configuration='[
  { "displayName":"Site", "field":"siteLabel" },
  { "displayName":"Agent", "field":"agent" },
  { "displayName":"Event", "field":"event_name" },
  { "displayName":"Scale A", "cellTemplate":"{{#if a_val1}}{{a_val1}}{{/if}}{{#if a_val2}} / {{a_val2}}{{/if}}{{#if a_val3}} / {{a_val3}}{{/if}}{{#if a_note}}<div class=\\\"muted\\\">{{a_note}}</div>{{/if}}" },
  { "displayName":"Scale B", "cellTemplate":"{{#if b_val1}}{{b_val1}}{{/if}}{{#if b_val2}} / {{b_val2}}{{/if}}{{#if b_val3}} / {{b_val3}}{{/if}}{{#if b_note}}<div class=\\\"muted\\\">{{b_note}}</div>{{/if}}" },
  { "displayName":"Scale C", "cellTemplate":"{{#if c_val1}}{{c_val1}}{{/if}}{{#if c_val2}} / {{c_val2}}{{/if}}{{#if c_val3}} / {{c_val3}}{{/if}}{{#if c_note}}<div class=\\\"muted\\\">{{c_note}}</div>{{/if}}" },
  { "displayName":"Magnitude", "cellTemplate":"{{#if mag_min}}{{mag_min}}{{/if}}{{#if mag_max}} — {{mag_max}}{{/if}}" },
  { "displayName":"Uncertainty", "cellTemplate":"{{#if unc_min}}{{unc_min}}{{/if}}{{#if unc_max}} — {{unc_max}}{{/if}}" },
  { "displayName":"Risk note", "field":"risk_desc" }
]' options='{"showFilter": true, "resultsPerPage": 10, "stickyHeader": true}'>
</semantic-table>
                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
