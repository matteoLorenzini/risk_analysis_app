[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>

  <template id='page'>
    <div class="rs-resource-container">
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="sites-modified">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="sites-modified">Sites Affected</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="sites-modified">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Sites Modified and Associated Risk</span>
                </div>
                
                <div style="margin-top:40px;">
                  <h2 class="h2" style="margin-bottom:15px;">Sites Affected by this Event</h2>

<semantic-table
  id="event-risk-table"
  query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT DISTINCT
  ?subject
  ?agent
  ?event_name
  ?a_val1 ?a_val2 ?a_val3 ?a_desc
  ?b_val1 ?b_val2 ?b_val3 ?b_desc
  ?c_val1 ?c_val2 ?c_val3 ?c_desc
  ?risk_desc
  ?magnitude_min_score ?magnitude_max_score
  ?uncertainty_min_score ?uncertainty_max_score
WHERE {
  BIND(<[[this]]> AS ?event)
  ?event a base:E5_Event .

  # sites impacted by event -> one row per E18
  ?event base:P31_has_modified ?site .
  ?site a base:E18_Physical_Thing .
  BIND(?site AS ?subject)
  OPTIONAL { ?site rdfs:label ?site_label }
  OPTIONAL { ?event rdfs:label ?event_name }

  OPTIONAL {
    ?event base:P11_had_participant ?actor .
    ?actor a base:E39_Actor ;
           rdfs:label ?agent .
  }

  OPTIONAL {
    ?ra a base:E89_Propositional_Object ;
        base:P129_is_about ?subject ;
        base:P129_is_about ?event .
    OPTIONAL { ?ra base:P3_has_note ?risk_desc }
  }

  # SCALE A: site-scoped only
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?v1) AS ?a_val1) (SAMPLE(?v2) AS ?a_val2) (SAMPLE(?v3) AS ?a_val3) (SAMPLE(?note) AS ?a_desc)
      WHERE {
        ?event base:P39i_was_measured_by ?measA .
        ?measA a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> ;
               base:P129_is_about ?site .
        OPTIONAL { ?measA base:P40_observed_dimension ?d1 . ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?v1. }
        OPTIONAL { ?measA base:P40_observed_dimension ?d2 . ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?v2. }
        OPTIONAL { ?measA base:P40_observed_dimension ?d3 . ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?v3. }
        OPTIONAL { ?measA base:P3_has_note ?note }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site }
  }

  # SCALE B: site-scoped only
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?v1) AS ?b_val1) (SAMPLE(?v2) AS ?b_val2) (SAMPLE(?v3) AS ?b_val3) (SAMPLE(?note) AS ?b_desc)
      WHERE {
        ?event base:P39i_was_measured_by ?measB .
        ?measB a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> ;
               base:P129_is_about ?site .
        OPTIONAL { ?measB base:P40_observed_dimension ?d1 . ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?v1. }
        OPTIONAL { ?measB base:P40_observed_dimension ?d2 . ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?v2. }
        OPTIONAL { ?measB base:P40_observed_dimension ?d3 . ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?v3. }
        OPTIONAL { ?measB base:P3_has_note ?note }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site }
  }

  # SCALE C: site-scoped only
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?v1) AS ?c_val1) (SAMPLE(?v2) AS ?c_val2) (SAMPLE(?v3) AS ?c_val3) (SAMPLE(?note) AS ?c_desc)
      WHERE {
        ?event base:P39i_was_measured_by ?measC .
        ?measC a crmsci:S21_Measurement ;
               base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> ;
               base:P129_is_about ?site .
        OPTIONAL { ?measC base:P40_observed_dimension ?d1 . ?d1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?v1. }
        OPTIONAL { ?measC base:P40_observed_dimension ?d2 . ?d2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?v2. }
        OPTIONAL { ?measC base:P40_observed_dimension ?d3 . ?d3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?v3. }
        OPTIONAL { ?measC base:P3_has_note ?note }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site }
  }

  # MAGNITUDE: site-scoped min/max
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?min) AS ?magnitude_min_score) (SAMPLE(?max) AS ?magnitude_max_score)
      WHERE {
        ?event base:P39i_was_measured_by ?mag .
        ?mag a crmsci:S21_Measurement ;
             base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
             base:P129_is_about ?site .
        OPTIONAL { ?mag base:P40_observed_dimension ?md1 . ?md1 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?min . FILTER(STRSTARTS(STR(?md1), "https://w3id.org/sirius/magnitude_score_min/")) }
        OPTIONAL { ?mag base:P40_observed_dimension ?md2 . ?md2 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?max . FILTER(STRSTARTS(STR(?md2), "https://w3id.org/sirius/magnitude_score_max/")) }
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site }
  }

  # UNCERTAINTY: site-scoped min/max (P90 or rdfs:label)
  OPTIONAL {
    { SELECT ?event ?site (SAMPLE(?umin_val) AS ?uncertainty_min_score) (SAMPLE(?umax_val) AS ?uncertainty_max_score)
      WHERE {
        ?event base:P39i_was_measured_by ?unc .
        ?unc a crmsci:S21_Measurement ;
             base:P2_has_type <https://w3id.org/sirius/type/uncertainty> ;
             base:P129_is_about ?site .
        OPTIONAL { ?unc base:P40_observed_dimension ?ud1 . ?ud1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?umin . FILTER(STRSTARTS(STR(?ud1), "https://w3id.org/sirius/uncertainty_min/")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ud2 . ?ud2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?umax . FILTER(STRSTARTS(STR(?ud2), "https://w3id.org/sirius/uncertainty_max/")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ul1 . ?ul1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?ulabelMin . FILTER(STRSTARTS(STR(?ul1), "https://w3id.org/sirius/uncertainty_min/")) }
        OPTIONAL { ?unc base:P40_observed_dimension ?ul2 . ?ul2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; rdfs:label ?ulabelMax . FILTER(STRSTARTS(STR(?ul2), "https://w3id.org/sirius/uncertainty_max/")) }
        BIND(COALESCE(?umin, ?ulabelMin) AS ?umin_val)
        BIND(COALESCE(?umax, ?ulabelMax) AS ?umax_val)
        ?event base:P31_has_modified ?site .
      } GROUP BY ?event ?site }
  }

} 
ORDER BY ?site_label
'
  column-configuration='[
    { "displayName": "Agent",       "cellTemplate": "{{> agentCell}}" },
    { "displayName": "Event",       "cellTemplate": "{{> eventNameCell}}" },
    { "displayName": "Scale A",     "cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_desc}}" },
    { "displayName": "Scale B",     "cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_desc}}" },
    { "displayName": "Scale C",     "cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_desc}}" },
    { "displayName": "Description", "cellTemplate": "{{> descCell}}" },
    { "displayName": "Magnitude",   "cellTemplate": "{{> valueRangeCell min=magnitude_min_score max=magnitude_max_score}}" },
    { "displayName": "Uncertainty", "cellTemplate": "{{> valueRangeCell min=uncertainty_min_score max=uncertainty_max_score}}" }
  ]'
  options='{"showFilter": true, "resultsPerPage": 10, "stickyHeader": true}'>
  <!-- retain existing cell templates below -->
  <!-- Site link cell (subject = site) -->
  <template id="siteLinkCell">
    {{#if subject.value}}
      <semantic-link iri="{{subject.value}}">
        <span class="pill">{{site_label.value}}</span>
      </semantic-link>
    {{else}}
      <span class="pill">Unknown Site</span>
    {{/if}}
  </template>

  <!-- Agent label -->
  <template id="agentCell">
    {{#if agent.value}}
      <div class="pill">{{agent.value}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <!-- Event name label -->
  <template id="eventNameCell">
    {{#if event_name.value}}
      <div class="pill">{{event_name.value}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <!-- Generic min / max value cell -->
  <template id="valueRangeCell">
    {{#if min.value}}
      <div class="val"><span class="dim-label">Val.</span> {{min.value}}</div>
      {{#if max.value}}<div class="val"><span class="dim-label">Val.</span> {{max.value}}</div>{{/if}}
    {{else}}
      {{#if max.value}}
        <div class="val"><span class="dim-label">Val.</span> {{max.value}}</div>
      {{else}}
        <div class="empty">—</div>
      {{/if}}
    {{/if}}
  </template>

  <!-- Scale triple cell -->
  <template id="scaleTripleCell">
    {{#if v1.value}}<div class="val"><strong><span class="dim-label">Val.</span> {{v1.value}}</strong></div>{{/if}}
    {{#if v2.value}}<div class="val"><strong><span class="dim-label">Val.</span> {{v2.value}}</strong></div>{{/if}}
    {{#if v3.value}}<div class="val"><strong><span class="dim-label">Val.</span> {{v3.value}}</strong></div>{{/if}}
    {{#unless v1.value}}{{#unless v2.value}}{{#unless v3.value}}<div class="empty">—</div>{{/unless}}{{/unless}}{{/unless}}
    <div class="note"><span class="dim-label">Description</span> {{#if desc.value}}{{desc.value}}{{else}}—{{/if}}</div>
  </template>

  <!-- Risk Analysis description -->
  <template id="descCell">
    {{#if risk_desc.value}}<div class="note">{{risk_desc.value}}</div>{{else}}<div class="empty">—</div>{{/if}}
  </template>

</semantic-table>

<!-- Event-level summary (show measurements that are NOT about a specific site) -->
<semantic-table id="event-summary" query='
PREFIX base:   <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?event
  (SAMPLE(?a1) AS ?a_val1) (SAMPLE(?a2) AS ?a_val2) (SAMPLE(?a3) AS ?a_val3) (SAMPLE(?a_note) AS ?a_desc)
  (SAMPLE(?b1) AS ?b_val1) (SAMPLE(?b2) AS ?b_val2) (SAMPLE(?b3) AS ?b_val3) (SAMPLE(?b_note) AS ?b_desc)
  (SAMPLE(?c1) AS ?c_val1) (SAMPLE(?c2) AS ?c_val2) (SAMPLE(?c3) AS ?c_val3) (SAMPLE(?c_note) AS ?c_desc)
  (SAMPLE(?magmin) AS ?magnitude_min_score) (SAMPLE(?magmax) AS ?magnitude_max_score)
  (SAMPLE(?uncmin) AS ?uncertainty_min_score) (SAMPLE(?uncmax) AS ?uncertainty_max_score)
WHERE {
  BIND(<[[this]]> AS ?event)
  ?event a base:E5_Event .

  # only measurements NOT scoped to a site (event-level)
  OPTIONAL {
    ?event base:P39i_was_measured_by ?mA .
    ?mA a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-a-score> .
    FILTER NOT EXISTS { ?mA base:P129_is_about ?anySite }
    OPTIONAL { ?mA base:P40_observed_dimension ?dA1 . ?dA1 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_1> ; rdfs:label ?a1. }
    OPTIONAL { ?mA base:P40_observed_dimension ?dA2 . ?dA2 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_2> ; rdfs:label ?a2. }
    OPTIONAL { ?mA base:P40_observed_dimension ?dA3 . ?dA3 base:P2_has_type <https://w3id.org/sirius/type/scale_a_val_3> ; rdfs:label ?a3. }
    OPTIONAL { ?mA base:P3_has_note ?a_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mB .
    ?mB a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-b-score> .
    FILTER NOT EXISTS { ?mB base:P129_is_about ?anySite }
    OPTIONAL { ?mB base:P40_observed_dimension ?dB1 . ?dB1 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_1> ; rdfs:label ?b1. }
    OPTIONAL { ?mB base:P40_observed_dimension ?dB2 . ?dB2 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_2> ; rdfs:label ?b2. }
    OPTIONAL { ?mB base:P40_observed_dimension ?dB3 . ?dB3 base:P2_has_type <https://w3id.org/sirius/type/scale_b_val_3> ; rdfs:label ?b3. }
    OPTIONAL { ?mB base:P3_has_note ?b_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mC .
    ?mC a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/scale-c-score> .
    FILTER NOT EXISTS { ?mC base:P129_is_about ?anySite }
    OPTIONAL { ?mC base:P40_observed_dimension ?dC1 . ?dC1 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_1> ; rdfs:label ?c1. }
    OPTIONAL { ?mC base:P40_observed_dimension ?dC2 . ?dC2 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_2> ; rdfs:label ?c2. }
    OPTIONAL { ?mC base:P40_observed_dimension ?dC3 . ?dC3 base:P2_has_type <https://w3id.org/sirius/type/scale_c_val_3> ; rdfs:label ?c3. }
    OPTIONAL { ?mC base:P3_has_note ?c_note }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?mag .
    ?mag a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/magnitude-score> .
    FILTER NOT EXISTS { ?mag base:P129_is_about ?anySite }
    OPTIONAL { ?mag base:P40_observed_dimension ?md1 . ?md1 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?magmin . FILTER(STRSTARTS(STR(?md1), "https://w3id.org/sirius/magnitude_score_min")) }
    OPTIONAL { ?mag base:P40_observed_dimension ?md2 . ?md2 base:P2_has_type <https://w3id.org/sirius/type/magnitude_score> ; base:P90_has_value ?magmax . FILTER(STRSTARTS(STR(?md2), "https://w3id.org/sirius/magnitude_score_max")) }
  }

  OPTIONAL {
    ?event base:P39i_was_measured_by ?unc .
    ?unc a crmsci:S21_Measurement ; base:P2_has_type <https://w3id.org/sirius/type/uncertainty> .
    FILTER NOT EXISTS { ?unc base:P129_is_about ?anySite }
    OPTIONAL { ?unc base:P40_observed_dimension ?ud1 . ?ud1 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?uncmin . FILTER(STRSTARTS(STR(?ud1), "https://w3id.org/sirius/uncertainty_min")) }
    OPTIONAL { ?unc base:P40_observed_dimension ?ud2 . ?ud2 base:P2_has_type <https://w3id.org/sirius/type/uncertainty-score> ; base:P90_has_value ?uncmax . FILTER(STRSTARTS(STR(?ud2), "https://w3id.org/sirius/uncertainty_max")) }
  }

} GROUP BY ?event
' column-configuration='[
  { "displayName": "Event summary", "cellTemplate": "{{> eventNameCell}}" },
  { "displayName": "Scale A", "cellTemplate": "{{> scaleTripleCell v1=a_val1 v2=a_val2 v3=a_val3 desc=a_desc}}" },
  { "displayName": "Scale B", "cellTemplate": "{{> scaleTripleCell v1=b_val1 v2=b_val2 v3=b_val3 desc=b_desc}}" },
  { "displayName": "Scale C", "cellTemplate": "{{> scaleTripleCell v1=c_val1 v2=c_val2 v3=c_val3 desc=c_desc}}" },
  { "displayName": "Magnitude", "cellTemplate": "{{> valueRangeCell min=magnitude_min_score max=magnitude_max_score}}" },
  { "displayName": "Uncertainty", "cellTemplate": "{{> valueRangeCell min=uncertainty_min_score max=uncertainty_max_score}}" }
]' options='{"showFilter": false, "resultsPerPage": 5, "stickyHeader": false}'>
  <!-- reuse eventNameCell / scaleTripleCell / valueRangeCell templates already defined below -->
</semantic-table>

<!-- existing per-site event-risk-table follows -->
                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>

    </div>
  </template>

</with-types>
