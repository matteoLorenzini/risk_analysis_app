[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event Details</bs-nav-item>
            <bs-nav-item event-key="sites-scores">Affected Sites & Scores</bs-nav-item> 
          </bs-nav>
          <bs-tab-content animation="true">
            
            <bs-tab-pane event-key="event-details">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event Summary</span>
                </div>
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions
                      event_name="http://www.siriusplatform-risk-assessment/field/event_event_name"
                      agent="http://www.siriusplatform-risk-assessment/field/event_agent"
                      risk_desc="http://www.siriusplatform-risk-assessment/field/event_risk_desc"
                      magnitude_min_score="http://www.siriusplatform-risk-assessment/field/event_magnitude_min_score"
                      uncertainty_min_score="http://www.siriusplatform-risk-assessment/field/event_uncertainty_min_score"
                      # Add other high-level event fields here
                    ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="sites-scores">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Site-Specific Event Scores</span>
                </div>
                
                <div style="margin-top:20px;">
                  <h2 class="h2" style="margin-bottom:15px;">Scores Per Event per Site</h2>

<semantic-table
  id="sites-scores-table"

  query-uri="http://www.siriusplatform-risk-assessment/query/event-site-measurement-query"
  
  # Map the variables from your successful query to the display columns
  column-configuration='[
    { "variable": "subject", "displayName": "Site (E18)", "cellTemplate": "{{> siteLinkCell}}", "isPivotal": true },
    { "variable": "event_name", "displayName": "Event Name", "isPivotal": true },
    { "variable": "risk_desc", "displayName": "Risk Description" },
    { "variable": "a_val1", "displayName": "Scale A (V1)" },
    { "variable": "b_val1", "displayName": "Scale B (V1)" },
    { "variable": "c_val1", "displayName": "Scale C (V1)" },
    { "variable": "magnitude_min_score", "displayName": "Magnitude Min" },
    { "variable": "uncertainty_min_score", "displayName": "Uncertainty Min" }
   
  ]'
  options='{"showFilter": true, "resultsPerPage": 50, "stickyHeader": true}'>

  <template id="siteLinkCell">
    {{#if subject.value}}
      <semantic-link iri="{{subject.value}}">
        <strong>{{site_label.value}}</strong>
      </semantic-link>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>
  
</semantic-table>

                </div>
              </div>
            </bs-tab-pane>

          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
