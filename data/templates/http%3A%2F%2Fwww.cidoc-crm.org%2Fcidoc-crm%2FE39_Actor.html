[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">
            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>
            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>
          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <!-- map removed for Event resource; keep title / actions -->
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>
              <div style="display: flex; gap: 12px; align-items:center;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="event-details">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="event-details">Event</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="event-details">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  <span class="h1 rs-resource-section--header">Event</span>
                </div>
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions siti="http://www.siriusplatform-risk-assessment/field/event_site_inverse"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>

                <!-- ADDED: Sites & Magnitude per Site for Events where this Actor participates -->
                <div style="margin-top:24px;">
                  <hr class="rs-resource-section--headerLine">
                  <span class="h2 rs-resource-section--header">Sites & Magnitude</span>

                  <semantic-table
                    id="actor-sites-magnitude"
                    prefetch-labels="false"
                    query="
                      PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

                      SELECT DISTINCT ?site ?siteLabel ?event ?eventLabel ?magnitude WHERE {
                        VALUES ?actor { <[[this]]> }

                        # Event(s) where actor participated and the site modified by the event
                        ?event a crm:E5_Event ;
                               crm:P11_had_participant ?actor ;
                               crm:P31_has_modified ?site .
                        ?site a crm:E18_Physical_Thing .

                        # Try measurement attached to the Event
                        {
                          ?event crm:P39i_was_measured_by ?m .
                          ?m crm:P40_observed_dimension ?d .
                          ?d crm:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
                             crm:P90_has_value ?magnitude .
                        }
                        UNION
                        {
                          # Or measurement attached to the Site
                          ?site crm:P39i_was_measured_by ?m2 .
                          ?m2 crm:P40_observed_dimension ?d2 .
                          ?d2 crm:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
                              crm:P90_has_value ?magnitude .
                        }

                        OPTIONAL { ?site rdfs:label ?siteLabel }
                        OPTIONAL { ?event rdfs:label ?eventLabel }
                      }
                      ORDER BY DESC(?magnitude)
                    "
                    tuple-template='{{> templateSiteMagnitude}}'
                    number-of-displayed-rows="12"
                    no-result-template='<bs-panel class=\"info\">No sites or magnitude scores found for this actor</bs-panel>'
                    options='{"showFilter": true, "pageSizeSelection": [6,12,24]}'>
                    <template id='templateSiteMagnitude'>
                      <bs-table class='table table-striped'>
                        <thead>
                          <tr>
                            <th>Site</th>
                            <th>Event</th>
                            <th>Magnitude</th>
                          </tr>
                        </thead>
                        <tbody>
                          {{#results}}
                            <tr>
                              <td>
                                {{#if siteLabel.value}}
                                  <semantic-link iri='{{site.value}}'>{{siteLabel.value}}</semantic-link>
                                {{else}}
                                  <semantic-link iri='{{site.value}}'>{{site.value}}</semantic-link>
                                {{/if}}
                              </td>
                              <td>
                                {{#if eventLabel.value}}
                                  <semantic-link iri='{{event.value}}'>{{eventLabel.value}}</semantic-link>
                                {{else}}
                                  <semantic-link iri='{{event.value}}'>{{event.value}}</semantic-link>
                                {{/if}}
                              </td>
                              <td>{{magnitude.value}}</td>
                            </tr>
                          {{/results}}
                        </tbody>
                      </bs-table>
                    </template>
                  </semantic-table>
                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
