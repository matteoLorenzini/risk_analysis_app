[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-event'}}" style="min-height: 260px;">
        <div class="rs-resource-header-content-container" style="display:flex; align-items:flex-start;">
          <div style="flex:1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title">
                <mp-label iri='[[this]]'></mp-label>
              </div>
              <div style="display:flex; gap:12px; margin-top:8px;">
                <mp-copy-to-clipboard text='[[this]]'><div class="rs-copy-IRI">Copy IRI</div></mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>
            </div>
            <div style="margin-top:12px;">
              <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions event_date="http://www.siriusplatform-risk-assessment/field/event_date" event_place="http://www.siriusplatform-risk-assessment/field/site_inverse" participants="http://www.siriusplatform-risk-assessment/field/agent" magnitude="http://www.siriusplatform-risk-assessment/field/min_score"]]'
                template='{{> template}}'>
                <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
              </mp-field-visualization>
            </div>
          </div>
          <div style="width:320px; padding-left:16px;">
            <div class="rs-resource-card">
              <h5 style="margin:0 0 8px 0;">Quick info</h5>
              <div style="font-size:13px; color:#555;">
                <mp-label iri='[[this]]' property='http://www.cidoc-crm.org/cidoc-crm/P4_has_time-span'></mp-label>
                <br/>
                <mp-label iri='[[this]]' property='http://www.cidoc-crm.org/cidoc-crm/P31_has_modified'></mp-label>
                <br/>
                <mp-label iri='[[this]]' property='http://www.cidoc-crm.org/extensions/crmsci/P39i_was_measured_by'></mp-label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="details">
        <bs-nav bs-style="tabs">
          <bs-nav-item event-key="details">Details</bs-nav-item>
        </bs-nav>
        <bs-tab-content animation="true">
          <bs-tab-pane event-key="details">
            <div class="rs-resource-tab-container">
              <hr class="rs-resource-section--headerLine">
              <span class="h1 rs-resource-section--header">Event Information</span>

              <div class="rs-resource-data-table">
                <mp-field-visualization
                  subject='[[this]]'
                  fields='[[fieldDefinitions event_date="http://www.siriusplatform-risk-assessment/field/event_date" event_place="http://www.siriusplatform-risk-assessment/field/site_inverse" participants="http://www.siriusplatform-risk-assessment/field/agent" magnitude="http://www.siriusplatform-risk-assessment/field/min_score"]]'
                  template='{{> template}}'>
                  <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                </mp-field-visualization>
              </div>

            </div>
          </bs-tab-pane>
        </bs-tab-content>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]
[[> resource]]
