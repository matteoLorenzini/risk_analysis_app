<semantic-form
  new-subject-template="http://www.researchspace.org/resource/ResourceContent/{{UUID}}"
  post-action="redirect"
  browser-persistence="true"
  form-id="example-2"
  fields='[
    {
      "id": "type",
      "label": "Type",
      "description": "The type of the created instance",
      "xsdDatatype": "xsd:anyURI",
      "minOccurs": "1",
      "maxOccurs": "1",
      "valueSetPattern": "
        SELECT $value $label WHERE {
          VALUES ($value $label) {
            (<http://www.cidoc-crm.org/cidoc-crm/E18_Physical_Thing> \"Human Made Object\")
            (<http://www.cidoc-crm.org/cidoc-crm/E73_Information_Object> \"Information Object\")
          }
        }
      ",
      "selectPattern": "SELECT $value WHERE { $subject a $value }",
      "insertPattern": "INSERT { $subject a $value } WHERE {}",
      "deletePattern": "DELETE { $subject a $value } WHERE {}"
    },
    {
      "id": "label",
      "label": "Label",
      "description": "The label used to display the instance",
      "xsdDatatype": "xsd:string",
      "minOccurs": "1",
      "maxOccurs": "1",

      "selectPattern": "SELECT $value WHERE { $subject skos:prefLabel $value }",
      "insertPattern": "INSERT { $subject skos:prefLabel $value } WHERE {}",
      "deletePattern": "DELETE { $subject skos:prefLabel $value } WHERE {}"
    }
  ]'
>
  <bs-panel>
    <h4>Create CRM Instance</h4>

    <semantic-form-recover-notification></semantic-form-recover-notification>

    <bs-tabs fixed-key="form">
      <bs-tab event-key="1" title="General Information">
        <semantic-form-text-input for="label" label="Label"></semantic-form-text-input>
        <semantic-form-select-input for="type" label="Type"></semantic-form-select-input>
      </bs-tab>
    </bs-tabs>

    <semantic-form-errors></semantic-form-errors>
    
    [[> rsp:FormDefaultActions formEntity='{{#if entityType}}{{entityType}}{{else}}Primary Source{{/if}}']]
  </bs-panel>
</semantic-form>
