<semantic-form
  new-subject-template="http://www.researchspace.org/resource/ResourceContent/{{UUID}}"
  post-action="redirect"
  browser-persistence="true"
  form-id="example-2"
  fields='[[ fieldDefinitions
    type                          = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
    denominazione_insert					= "http://www.siriusplatform-risk-assessment/field/denominazione_insert"
  ]]'
>
  <bs-panel>
    <h4>Create CRM Instance</h4>

    <semantic-form-recover-notification></semantic-form-recover-notification>

    <bs-tabs fixed-key="form">
      <bs-tab event-key="1" title="General Information">
        <semantic-form-text-input for="label" label="Label"></semantic-form-text-input>
      </bs-tab>
    </bs-tabs>

    <semantic-form-errors></semantic-form-errors>

    <div class="btn-group">
      <button name="reset" class="btn btn-default">Reset</button>
      <button name="submit" class="btn btn-action">Save</button>
    </div>
  </bs-panel>
</semantic-form>
