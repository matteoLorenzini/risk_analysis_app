<semantic-form
  persistence='{"type": "sparql", "targetInsertGraphIri": "http://www.siriusplatform-risk-assessment/graph/data"}'
  new-subject-template="http://www.siriusplatform-risk-assessment/resource/site/{{{{raw}}}}{{UUID}}{{{{/raw}}}}"
  fields='[[ fieldDefinitions
    type                = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
    denominazione_insert = "http://www.siriusplatform-risk-assessment/field/denominazione_insert"
    source_comment      = "https://veniss.net/container/fieldDefinitionContainer/source_comment"
  ]]'
  [[> rsp:FormDefaults]]
>
  <div class="form-scroll-area">
    <div class="container-fluid">
      
      <semantic-form-hidden-input for="type" default-value='http://www.cidoc-crm.org/cidoc-crm/E18_Physical_Thing'></semantic-form-hidden-input>

      <bs-row>
        <bs-col md="12">
          <h3>Insert New Site</h3>
          <hr />
        </bs-col>
      </bs-row>

      <bs-row>
        <bs-col md="8" sm="12">
          <div id="denominazione_insert" style="margin-bottom: 20px;">
            <semantic-form-text-input 
              for="denominazione_insert" 
              label="Denominazione (Site Name)" 
              placeholder="Inserisci la denominazione del sito..."
              languages='["it", "en"]'>
            </semantic-form-text-input>
          </div>

          <div id="source_comment" style="margin-bottom: 20px;">
            <semantic-form-text-input 
              for="source_comment" 
              label="Note / Descrizione" 
              multiline="true" 
              rows="5" 
              placeholder="Aggiungi note aggiuntive...">
            </semantic-form-text-input>
          </div>
        </bs-col>

        <bs-col md="4" sm="12">
          <div style="background: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px solid #ddd;">
            <h4>Help</h4>
            <p>This form creates a new record in the Sirius Risk Assessment platform. The ID is generated automatically using a UUID.</p>
          </div>
        </bs-col>
      </bs-row>

      <semantic-form-errors></semantic-form-errors>

      <div class="form-actions">
        [[> rsp:FormDefaultActions formEntity='Site']]
      </div>

    </div>
  </div>
</semantic-form>
