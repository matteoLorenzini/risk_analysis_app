<semantic-form 
  fields='[[ fieldDefinitions
  
    denominazione_insert="http://www.siriusplatform-risk-assessment/field/denominazione_insert"
   
  ]]'
  >

  <!-- ResearchSpace form control (self-closing) -->
  <semantic-form-text-input for="denominazione_insert"
                            label="Denominazione Sito"
                            placeholder="Insert Site's name here" />

  <!-- Fallback native input to verify the field renders when the custom component isn't available -->
  <div style="margin-top:8px;">
    <label for="denominazione_insert_fallback" style="display:block;font-size:0.9rem;margin-bottom:4px;">Denominazione (fallback)</label>
    <input id="denominazione_insert_fallback" name="denominazione_insert_fallback" placeholder="Insert Site's name here" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:3px;" />
  </div>

  [[> rsp:FormDefaultActions]]
</semantic-form>
