<div class="bso-component home-search">
    <bs-col md="10" md-offset="1">
        <div class="bso-component simple-search">
            <semantic-simple-search
              query='
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                PREFIX crmgeo: <http://www.ics.forth.gr/isl/CRMgeo/>
                
                SELECT DISTINCT ?resource ?label ?typelabel WHERE {
                  {
                    # Sites (E18_Physical_Thing)
                    ?resource a crm:E18_Physical_Thing ;
                              crm:P1_is_identified_by ?name_identifier .
                    ?name_identifier a crm:E41_Appellation ;
                                     skos:prefLabel ?label .
                    BIND("Site" AS ?typelabel)
                  } UNION {
                    # Places (E53_Place)
                    ?resource a crm:E53_Place ;
                              crmgeo:P1_is_identified_by ?appellation .
                    ?appellation a crmgeo:E44_Place_Appellation ;
                                 skos:prefLabel ?label .
                    BIND("Place" AS ?typelabel)
                  } UNION {
                    # Agents (E39_Actor)
                    ?resource a crm:E39_Actor ;
                              crm:P1_is_identified_by ?name_identifier .
                    ?name_identifier a crm:E41_Appellation ;
                                     skos:prefLabel ?label .
                    BIND("Agent" AS ?typelabel)
                  } UNION {
                    # Events (E5_Event)
                    ?resource a crm:E5_Event ;
                              rdfs:label ?label .
                    BIND("Event" AS ?typelabel)
                  }
                  
                  FILTER REGEX(?label, ?__token__, "i")
                } 
                LIMIT 10'
              template='<span style="color: blue;" title="{{resource.value}}">{{label.value}} <em style="color: #999;">({{typelabel.value}})</em></span>'
              input-placeholder='Search for sites, agents, events, places...'
            >
            </semantic-simple-search>
        </div>
    </bs-col>
</div>

<div class="bso-component separator panel">
    <bs-row>
        <bs-col md="2">
            <h3>Sites</h3>
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       SELECT (COUNT(?subject) as ?num) WHERE {
                           ?subject a crm:E18_Physical_Thing .
                       }"
                template="{{#each bindings}}Found {{num.value}} sites{{/each}}"
            ></semantic-query>
            <div class="bottom">
                <semantic-link iri="http://www.siriusplatform-risk-assessment/resource/structured-search">
                    See all
                </semantic-link>
            </div>
        </bs-col>
        <bs-col md="10" class="bso-component card-container horizontal-scroll">
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                       
                       SELECT DISTINCT ?subject ?label WHERE {
                           ?subject a crm:E18_Physical_Thing ;
                                   crm:P1_is_identified_by ?appellation .
                           ?appellation a crm:E41_Appellation ;
                                       skos:prefLabel ?label .
                           BIND(DAY(NOW()) as ?day)
                           BIND(SHA512(CONCAT(STR(?day), STR(?subject))) AS ?random)
                       } ORDER BY ?random LIMIT 10"
                template="{{#each bindings}}<div class='card' style='display: inline-block; margin: 10px; width: 200px; height: 120px; border: 1px solid #ddd; padding: 15px; border-radius: 4px; vertical-align: top; overflow: hidden;'><div class='card-body' style='height: 100%; display: flex; align-items: center; justify-content: center;'><h5 style='margin: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;'><semantic-link iri='{{subject.value}}'>{{label.value}}</semantic-link></h5></div></div>{{/each}}"
            ></semantic-query>
        </bs-col>
    </bs-row>
</div>
