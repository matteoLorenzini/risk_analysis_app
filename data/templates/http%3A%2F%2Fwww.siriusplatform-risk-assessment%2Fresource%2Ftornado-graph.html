<semantic-table
  id="risk-table"
  query='
PREFIX cidoc:  <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX crmsci: <http://www.ics.forth.gr/isl/CRMsci/>
PREFIX rdfs:  <http://www.w3.org/2000/01/rdf-schema#>
PREFIX xsd:   <http://www.w3.org/2001/XMLSchema#>
PREFIX skos:  <http://www.w3.org/2004/02/skos/core#>

SELECT
  ?subject
  ?event_name
  ?magnitudo
  ?bgColor
  ?bdColor
WHERE {
  VALUES ?subject { <[[this]]> }

  ################ EVENT + AVG MAGNITUDE (NEW + LEGACY) ################
  {
    SELECT
      ?subject ?event ?event_name
      (AVG(?score) AS ?magnitudo)
    WHERE {
      ?subject ^cidoc:P31_has_modified ?event .
      OPTIONAL {
        ?event cidoc:P2_has_type ?eventType .
        ?eventType skos:prefLabel ?eventPrefLabel .
        FILTER(LANG(?eventPrefLabel) = "en" || LANG(?eventPrefLabel) = "")
        BIND(STR(?eventPrefLabel) AS ?event_name)
      }

      {
        GRAPH <file://E89_risk.rdf-15-01-2026-10-21-25> {
          ?event cidoc:P39i_was_measured_by ?measurement .

          ?measurement a crmsci:S21_Measurement ;
                       cidoc:P2_has_type ?scaleType ;
                       cidoc:P40_observed_dimension ?dim .

          FILTER(?scaleType IN (
            <https://w3id.org/sirius/type/scale-a-score>,
            <https://w3id.org/sirius/type/scale-b-score>,
            <https://w3id.org/sirius/type/scale-c-score>
          ))

          ?dim cidoc:P2_has_type ?dimType ;
               rdfs:label ?rawScore .

          FILTER(?dimType IN (
            <https://w3id.org/sirius/type/scale_a_val_1>,
            <https://w3id.org/sirius/type/scale_a_val_2>,
            <https://w3id.org/sirius/type/scale_a_val_3>,
            <https://w3id.org/sirius/type/scale_b_val_1>,
            <https://w3id.org/sirius/type/scale_b_val_2>,
            <https://w3id.org/sirius/type/scale_b_val_3>,
            <https://w3id.org/sirius/type/scale_c_val_1>,
            <https://w3id.org/sirius/type/scale_c_val_2>,
            <https://w3id.org/sirius/type/scale_c_val_3>
          ))
        }
      }
      UNION
      {
        ?event cidoc:P39i_was_measured_by ?measurement .
        ?measurement a crmsci:S21_Measurement ;
                     cidoc:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
                     cidoc:P40_observed_dimension ?dim .
        FILTER(
          CONTAINS(STR(?dim), "magnitude_score_min") ||
          CONTAINS(STR(?dim), "magnitude_score_max")
        )
        ?dim cidoc:P90_has_value ?rawScore .
      }

      FILTER(REGEX(STR(?rawScore), "^-?[0-9]+([\\.,][0-9]+)?$"))
      BIND(xsd:decimal(REPLACE(STR(?rawScore), ",", ".")) AS ?score)
    }
    GROUP BY ?subject ?event ?event_name
  }

  ################ GLOBAL RANGE ################
  {
    SELECT ?subject (MIN(?m) AS ?globalMin) (MAX(?m) AS ?globalMax)
    WHERE {
      {
        SELECT ?subject ?event (AVG(?score) AS ?m)
        WHERE {
          ?subject ^cidoc:P31_has_modified ?event .

          {
            GRAPH <file://E89_risk.rdf-15-01-2026-10-21-25> {
              ?event cidoc:P39i_was_measured_by ?measurement .

              ?measurement a crmsci:S21_Measurement ;
                           cidoc:P2_has_type ?scaleType ;
                           cidoc:P40_observed_dimension ?dim .

              FILTER(?scaleType IN (
                <https://w3id.org/sirius/type/scale-a-score>,
                <https://w3id.org/sirius/type/scale-b-score>,
                <https://w3id.org/sirius/type/scale-c-score>
              ))

              ?dim cidoc:P2_has_type ?dimType ;
                   rdfs:label ?rawScore .

              FILTER(?dimType IN (
                <https://w3id.org/sirius/type/scale_a_val_1>,
                <https://w3id.org/sirius/type/scale_a_val_2>,
                <https://w3id.org/sirius/type/scale_a_val_3>,
                <https://w3id.org/sirius/type/scale_b_val_1>,
                <https://w3id.org/sirius/type/scale_b_val_2>,
                <https://w3id.org/sirius/type/scale_b_val_3>,
                <https://w3id.org/sirius/type/scale_c_val_1>,
                <https://w3id.org/sirius/type/scale_c_val_2>,
                <https://w3id.org/sirius/type/scale_c_val_3>
              ))
            }
          }
          UNION
          {
            ?event cidoc:P39i_was_measured_by ?measurement .
            ?measurement a crmsci:S21_Measurement ;
                         cidoc:P2_has_type <https://w3id.org/sirius/type/magnitude-score> ;
                         cidoc:P40_observed_dimension ?dim .
            FILTER(
              CONTAINS(STR(?dim), "magnitude_score_min") ||
              CONTAINS(STR(?dim), "magnitude_score_max")
            )
            ?dim cidoc:P90_has_value ?rawScore .
          }

          FILTER(REGEX(STR(?rawScore), "^-?[0-9]+([\\.,][0-9]+)?$"))
          BIND(xsd:decimal(REPLACE(STR(?rawScore), ",", ".")) AS ?score)
        }
        GROUP BY ?subject ?event
      }
    }
    GROUP BY ?subject
  }

  ############ COLOR LOGIC ############
  BIND(xsd:decimal(?globalMax - ?globalMin) AS ?range)
  BIND(IF(?range > 0, (?magnitudo - ?globalMin)/?range, 0.5) AS ?pct)

  # flip scale: green→yellow→red
  BIND(ROUND(120 * (1 - ?pct)) AS ?hue)

  BIND(CONCAT("hsl(", STR(?hue), ",70%,85%)") AS ?bgColor)
  BIND(CONCAT("hsl(", STR(?hue), ",70%,40%)") AS ?bdColor)
}
ORDER BY DESC(?magnitudo)
'
  column-configuration='[
    { "displayName": "Event",           "cellTemplate": "{{> eventCell}}" },
    { "displayName": "Magnitude (avg)", "cellTemplate": "{{> magnitudoCell}}" }
  ]'
  options='{"showFilter": true, "resultsPerPage": 10, "stickyHeader": true}'>

  <template id="eventCell">
    {{#if event_name.value}}
      <div class="pill">{{event_name.value}}</div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

  <template id="magnitudoCell">
    {{#if magnitudo.value}}
      <div class="pill magnitude-cell"
           style="background-color: {{bgColor.value}}; border-color: {{bdColor.value}};">
        {{magnitudo.value}}
      </div>
    {{else}}
      <div class="empty">—</div>
    {{/if}}
  </template>

</semantic-table>

<style>
  #risk-table .pill { display:inline-block; padding:.2rem .5rem;
    border:1px solid #e5e7eb; border-radius:999px; }
  #risk-table .empty{ text-align:center; opacity:.5; }
  #risk-table .magnitude-cell { font-weight: 600; }
</style>
